<!DOCTYPE html>
<html lang="en" class="bg-[#050505] text-[#F5F0E8] antialiased selection:bg-[#C9A96E] selection:text-black">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | VANTAGE LEGAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{serif:['Italiana','serif'],sans:['Inter','sans-serif']},colors:{gold:'#C9A96E',cream:'#F5F0E8',void:'#050505',coal:'#0E0E0E'}}}}</script>
<style>
body{font-family:'Inter',sans-serif;background:#050505;}.font-serif{font-family:'Italiana',serif!important;}
.hairline{border-color:rgba(201,169,110,.18);}
.menu-overlay{clip-path:circle(0% at 100% 0);transition:clip-path .8s cubic-bezier(.77,0,.175,1);}.menu-overlay.open{clip-path:circle(150% at 100% 0);}
.field{background:transparent;border:0;border-bottom:1px solid rgba(245,240,232,.18);padding:1rem 0;font-family:'Italiana',serif;font-size:1.5rem;color:#F5F0E8;width:100%;transition:border .3s;}
.field::placeholder{color:rgba(245,240,232,.28);} .field:focus{outline:none;border-color:#C9A96E;}
label.luxe{font-size:11px;text-transform:uppercase;letter-spacing:.25em;color:rgba(245,240,232,.45);}
.group:focus-within label.luxe{color:#C9A96E;}
</style>
</head>
<body class="font-sans">
<div class="fixed top-0 w-full z-[60] bg-[#050505]/85 backdrop-blur-md border-b hairline">
  <div class="max-w-5xl mx-auto px-6 h-[68px] flex items-center justify-between">
    <a href="index.html" class="font-serif text-[24px] tracking-[0.22em]">VANTAGE</a>
    <button onclick="document.getElementById('menu').classList.toggle('open')" class="flex items-center gap-3 text-[12px] uppercase tracking-[0.25em] hover:text-[#C9A96E] transition">Menu<span class="flex flex-col gap-[5px] w-7"><span class="h-px bg-current w-full"></span><span class="h-px bg-current w-2/3 ml-auto"></span></span></button>
  </div>
</div>
<div id="menu" class="menu-overlay fixed inset-0 bg-[#C9A96E] z-[55] flex items-center justify-center">
  <div class="flex flex-col space-y-6 text-center">
    <a href="index.html" class="text-[#050505] text-5xl md:text-6xl font-serif hover:italic transition-all">Index</a>
    <a href="about.html" class="text-[#050505] text-5xl md:text-6xl font-serif hover:italic transition-all">The Firm</a>
    <a href="practice.html" class="text-[#050505] text-5xl md:text-6xl font-serif hover:italic transition-all">Expertise</a>
    <a href="contact.html" class="text-[#050505] text-5xl md:text-6xl font-serif italic transition-all">Contact</a>
  </div>
</div>

<section class="min-h-screen pt-[130px] pb-20 px-6 flex flex-col justify-center">
  <div class="max-w-5xl mx-auto w-full">
    <div class="border-l-2 border-[#C9A96E] pl-8 md:pl-16 py-6">
      <div class="flex items-center gap-4 mb-6"><span class="h-px w-12 bg-[#C9A96E]"></span><p class="text-[#C9A96E] uppercase tracking-[0.32em] text-[11px]">04 — Privileged &amp; Confidential</p></div>
      <h2 class="font-serif leading-[0.9]" style="font-size:clamp(3.5rem,9vw,7rem)">INITIATE<br><span class="italic text-[#F5F0E8]/35">protocol.</span></h2>
      <p class="mt-6 text-[#F5F0E8]/50 font-light max-w-lg">All inquiries encrypted. Urgent matters answered within the hour — day or night.</p>
    </div>
    <form class="mt-14 space-y-10 border-t hairline pt-12" onsubmit="return false;">
      <div class="grid md:grid-cols-2 gap-10">
        <div class="group"><label class="luxe block mb-1 transition">Identify Yourself</label><input type="text" class="field" placeholder="Full Name"></div>
        <div class="group"><label class="luxe block mb-1 transition">Communication Channel</label><input type="email" class="field" placeholder="Email Address"></div>
      </div>
      <div class="group"><label class="luxe block mb-1 transition">The Brief</label><textarea rows="2" class="field resize-none" placeholder="Nature of Inquiry"></textarea></div>
      <button class="mt-4 px-12 py-5 bg-[#F5F0E8] text-black hover:bg-[#C9A96E] transition-all duration-300 uppercase tracking-[0.2em] text-[12px] font-semibold flex items-center gap-4 group">Submit Brief <span class="group-hover:translate-x-2 transition-transform">→</span></button>
    </form>
    <div class="mt-16 grid grid-cols-2 md:grid-cols-3 gap-8 text-[11px] uppercase tracking-[0.22em] text-[#F5F0E8]/40 border-t hairline pt-8">
      <div><p class="text-[#F5F0E8] mb-2">New Delhi</p><p>Defence Colony, Block A</p></div>
      <div><p class="text-[#F5F0E8] mb-2">Contact</p><p>secure@vantage.legal</p></div>
      <div><p class="text-[#C9A96E] mb-2">Priority Line</p><p class="font-serif text-xl tracking-normal text-[#F5F0E8]">+1 (212) 555-0199</p></div>
    </div>
  </div>
</section>
</body>
</html>
