<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Estate</title>
  <meta name="description" content="Estate admin panel — manage properties, enquiries, site visits and clients. Demo powered by HTMX.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans:['Inter','sans-serif'], head:['Poppins','sans-serif'] },
          colors: { accent:'#2563EB', 'accent-light':'#EFF6FF', ink:'#0A0F1E', gold:'#C9A86A', 'gold-soft':'#F7EDD8' }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1,h2,h3,h4 { font-family: 'Poppins', sans-serif; }
    .card-hover { transition: transform .25s ease, box-shadow .25s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,.1); }
    .htmx-indicator { opacity: 0; transition: opacity .2s ease; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    body.no-auth #sidebar, body.no-auth #sidebar-backdrop { display: none; }
    body.no-auth .lg\:pl-64 { padding-left: 0; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

<div class="lg:pl-64">
  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-sm border-b border-gray-200 sticky top-0 z-40">
    <div class="flex items-center justify-between px-4 sm:px-6 h-16">
      <div class="flex items-center gap-3">
        <button id="sidebar-toggle" class="lg:hidden p-2 rounded-lg hover:bg-gray-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a href="index.html" class="text-xl font-black font-head text-gray-900">Estate<span class="text-accent">.</span> <span class="text-xs font-semibold text-gray-400 align-middle">ADMIN</span></a>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <a href="index.html" target="_blank" class="hidden sm:flex text-sm font-semibold border border-gray-200 px-4 py-2 rounded-full hover:border-accent hover:text-accent transition-all">View Site ↗</a>
        <button id="reset-btn" title="Restore the original demo data" class="text-sm font-semibold border border-gray-200 px-4 py-2 rounded-full hover:border-red-200 hover:text-red-600 transition-all">↺ Reset</button>
        <button id="logout-btn" class="text-sm font-semibold bg-gray-100 px-4 py-2 rounded-full hover:bg-red-50 hover:text-red-600 transition-all">Logout</button>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 border-r border-gold/20 lg:translate-x-0 -translate-x-full transition-transform duration-300 flex flex-col text-white" style="background: linear-gradient(180deg, #070B18 0%, #0A0F1E 60%, #131B3A 100%);">
    <div class="h-16 flex items-center gap-3 px-6 border-b border-white/10">
      <div class="w-9 h-9 rounded-xl flex items-center justify-center text-ink text-lg font-black" style="background: linear-gradient(135deg,#F3D9A4,#C9A86A); box-shadow: 0 6px 18px rgba(201,168,106,.4);">◆</div>
      <div>
        <div class="font-black font-head text-white leading-tight">Estate Admin</div>
        <div class="text-[11px] text-gold/80 tracking-widest uppercase">◆ Premium Portal</div>
      </div>
    </div>
    <nav class="flex-1 overflow-y-auto px-3 py-5 space-y-1">
      <div class="px-3 pb-2 text-[11px] font-bold uppercase tracking-wider text-gray-400">Overview</div>
      <button data-nav="dashboard" hx-get="/partials/admin/dashboard" hx-target="#admin-root" hx-swap="innerHTML" class="sidebar-btn w-full flex items-center gap-3 text-sm font-semibold px-4 py-2.5 rounded-xl transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </button>

      <div class="px-3 pt-4 pb-2 text-[11px] font-bold uppercase tracking-wider text-gray-400">Properties</div>
      <button data-nav="properties" hx-get="/partials/admin/properties" hx-target="#admin-root" hx-swap="innerHTML" class="sidebar-btn w-full flex items-center gap-3 text-sm font-semibold px-4 py-2.5 rounded-xl transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
        Property List
      </button>
      <button data-nav="add-property" hx-get="/partials/admin/property-form" hx-target="#admin-root" hx-swap="innerHTML" class="sidebar-btn w-full flex items-center gap-3 text-sm font-semibold px-4 py-2.5 rounded-xl transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Add Property
      </button>

      <div class="px-3 pt-4 pb-2 text-[11px] font-bold uppercase tracking-wider text-gray-400">Customers</div>
      <button data-nav="enquiries" hx-get="/partials/admin/enquiries" hx-target="#admin-root" hx-swap="innerHTML" class="sidebar-btn w-full flex items-center gap-3 text-sm font-semibold px-4 py-2.5 rounded-xl transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        Enquiries
      </button>
      <button data-nav="visits" hx-get="/partials/admin/visits" hx-target="#admin-root" hx-swap="innerHTML" class="sidebar-btn w-full flex items-center gap-3 text-sm font-semibold px-4 py-2.5 rounded-xl transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Site Visits
      </button>
      <button data-nav="clients" hx-get="/partials/admin/clients" hx-target="#admin-root" hx-swap="innerHTML" class="sidebar-btn w-full flex items-center gap-3 text-sm font-semibold px-4 py-2.5 rounded-xl transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Clients
      </button>

      <div class="px-3 pt-4 pb-2 text-[11px] font-bold uppercase tracking-wider text-gray-400">Insights</div>
      <button data-nav="analytics" hx-get="/partials/admin/analytics" hx-target="#admin-root" hx-swap="innerHTML" class="sidebar-btn w-full flex items-center gap-3 text-sm font-semibold px-4 py-2.5 rounded-xl transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        Analytics
      </button>

      <div class="px-3 pt-4 pb-2 text-[11px] font-bold uppercase tracking-wider text-gray-400">Team & Settings</div>
      <button data-nav="agents" hx-get="/partials/admin/agents" hx-target="#admin-root" hx-swap="innerHTML" class="sidebar-btn w-full flex items-center gap-3 text-sm font-semibold px-4 py-2.5 rounded-xl transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Employees
      </button>
      <button data-nav="settings" hx-get="/partials/admin/settings" hx-target="#admin-root" hx-swap="innerHTML" class="sidebar-btn w-full flex items-center gap-3 text-sm font-semibold px-4 py-2.5 rounded-xl transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </button>
    </nav>
    <div class="p-3 border-t border-gray-100">
      <div class="bg-accent-light rounded-2xl p-4">
        <div class="text-sm font-bold text-gray-900 mb-1">Need a hand?</div>
        <p class="text-xs text-gray-500 mb-3">Everything here is a demo. Hit reset anytime to restore original data.</p>
        <a href="contact.html" class="text-xs font-bold text-accent hover:underline">Contact support →</a>
      </div>
    </div>
  </aside>
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden"></div>

  <!-- Content -->
  <main class="p-4 sm:p-6 lg:p-8">
    <div id="admin-root"
         hx-get="/partials/admin/dashboard" hx-trigger="load" hx-swap="innerHTML" hx-indicator="#admin-loading">
      <div class="flex items-center justify-center py-40 text-gray-400">
        <svg class="animate-spin w-6 h-6 mr-2 text-accent" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        Loading admin panel...
      </div>
    </div>
  </main>
</div>

<div id="admin-loading" class="htmx-indicator fixed top-0 left-0 right-0 z-[60] h-1 bg-accent"></div>

<script>
  // Send the admin key header on every HTMX request. Registered before htmx loads.
  document.addEventListener('htmx:configRequest', function (evt) {
    var key = localStorage.getItem('estateAdmin');
    if (key) evt.detail.headers['X-Admin-Key'] = key;
  });

  // Active sidebar state
  function setActive(nav) {
    document.querySelectorAll('.sidebar-btn').forEach(function (b) {
      var active = b.getAttribute('data-nav') === nav;
      b.classList.toggle('bg-accent', active);
      b.classList.toggle('text-white', active);
      b.classList.toggle('shadow-md', active);
      b.classList.toggle('shadow-blue-200', active);
      b.classList.toggle('text-gray-600', !active);
      b.classList.toggle('hover:bg-gray-50', !active);
    });
  }
  document.querySelectorAll('.sidebar-btn').forEach(function (b) {
    b.addEventListener('click', function () { setActive(b.getAttribute('data-nav')); closeSidebar(); });
  });
  setActive('dashboard');

  // Mobile sidebar
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebar-backdrop');
  function closeSidebar() { sidebar.classList.add('-translate-x-full'); sidebar.classList.remove('translate-x-0'); backdrop.classList.add('hidden'); }
  function openSidebar() { sidebar.classList.remove('-translate-x-full'); sidebar.classList.add('translate-x-0'); backdrop.classList.remove('hidden'); }
  document.getElementById('sidebar-toggle').addEventListener('click', openSidebar);
  backdrop.addEventListener('click', closeSidebar);

  // Logout
  document.getElementById('logout-btn').addEventListener('click', function () {
    localStorage.removeItem('estateAdmin');
    syncAuth();
    setActive('dashboard');
    htmx.ajax('GET', '/partials/admin/dashboard', { target: '#admin-root', swap: 'innerHTML' });
  });
  // Show the sidebar only after login, hide it on the login screen.
  function syncAuth() {
    document.body.classList.toggle('no-auth', !localStorage.getItem('estateAdmin'));
  }
  syncAuth();
  document.addEventListener('htmx:afterRequest', function () {
    if (!document.getElementById('admin-login') && !localStorage.getItem('estateAdmin')) {
      localStorage.setItem('estateAdmin', 'estate-admin');
    }
    syncAuth();
  });
  // Reset demo — restore the original seeded data and reload.
  document.getElementById('reset-btn').addEventListener('click', function () {
    if (!confirm('Restore the original demo properties, leads and clients? Changes made here will be lost.')) return;
    EstateServer.reset();
    location.reload();
  });
</script>
<script src="data/properties.js"></script>
<script src="js/util.js"></script>
<script src="js/cards.js"></script>
<script src="js/admin.js"></script>
<script src="js/estate.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</body>
</html>
