<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candles — LUME Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{serif:['Fraunces','serif'],sans:['Manrope','sans-serif']},colors:{paper:'#FFFBF1',ink:'#1A0E06',ember:'#E4572E',line:'#EDE0CC'}}}}</script>
<style>body{background:#FFFBF1;color:#1A0E06;font-family:Manrope,sans-serif}.navA{background:#FFFBF1!important;color:#1A0E06!important;font-weight:800}</style>
</head>
<body>
<div class="flex min-h-screen">
<aside class="hidden lg:flex w-[260px] flex-col sticky top-0 h-screen text-white" style="background:#1A0E06">
  <div class="px-6 py-6" style="border-bottom:1px solid rgba(255,255,255,.1)"><a href="../index.html" class="flex items-center gap-2"><span class="w-9 h-9 rounded-full flex items-center justify-center" style="background:#E4572E">✦</span><span class="font-serif text-xl">Lume.</span><span class="text-[10px] font-extrabold px-2 py-1 rounded-full bg-white/10">STUDIO</span></a></div>
  <nav class="flex-1 px-3 py-4 space-y-1 text-sm font-semibold"><a href="index.html" class="flex px-4 py-3 rounded-2xl text-white/70 hover:bg-white/10">◍ Dashboard</a><a href="products.html" class="navA flex px-4 py-3 rounded-2xl">🕯️ Candles</a><a href="custom-orders.html" class="flex px-4 py-3 rounded-2xl text-white/70 hover:bg-white/10">✦ Custom</a><a href="orders.html" class="flex px-4 py-3 rounded-2xl text-white/70 hover:bg-white/10">▤ Orders</a><div class="pt-4 mt-4" style="border-top:1px solid rgba(255,255,255,.1)"><a href="../index.html" class="flex px-4 py-2 text-white/60 text-[13px]">← View store</a></div></nav>
</aside>
<div class="flex-1 min-w-0">
<header class="sticky top-0 z-10 bg-white/90" style="border-bottom:1px solid #EDE0CC;backdrop-filter:blur(10px)"><div class="px-4 lg:px-8 h-[64px] flex items-center justify-between"><h1 class="font-serif text-2xl">Candles <span id="count" class="text-sm opacity-50"></span></h1><div class="flex gap-2"><button onclick="resetCandles();render();showToast('Catalogue reset')" class="hidden sm:inline-flex px-4 py-2 rounded-full text-sm font-bold" style="border:1px solid #EDE0CC">Reset</button><button onclick="openModal()" class="px-5 py-2 rounded-full text-sm font-bold text-white" style="background:#1A0E06">+ Add candle</button></div></div></header>
<main class="px-4 lg:px-8 py-6 max-w-6xl">
  <div class="rounded-2xl bg-white p-4 flex flex-col lg:flex-row gap-3" style="border:1px solid #EDE0CC">
    <div class="flex-1 flex items-center gap-2 rounded-full px-4 py-2.5" style="border:1px solid #EDE0CC;background:#FFFBF1"><span>⌕</span><input id="search" placeholder="Search scent, collection…" class="flex-1 outline-none text-sm bg-transparent" oninput="render()"></div>
    <select id="col" class="rounded-full px-4 py-2.5 text-sm bg-white font-semibold" style="border:1px solid #EDE0CC" onchange="render()"><option value="All">All collections</option><option>Woody</option><option>Warm</option><option>Fresh</option><option>Floral</option><option>Citrus</option></select>
    <select id="sort" class="rounded-full px-4 py-2.5 text-sm bg-white font-semibold" style="border:1px solid #EDE0CC" onchange="render()"><option value="newest">Newest</option><option value="price-asc">Price low</option><option value="price-desc">Price high</option><option value="name">Name</option></select>
  </div>
  <div class="mt-4 rounded-2xl bg-white overflow-hidden overflow-x-auto" style="border:1px solid #EDE0CC"><table class="w-full text-sm min-w-[760px]"><thead class="text-[11px] uppercase tracking-widest opacity-50" style="background:#FFFBF1"><tr><th class="text-left px-4 py-3">Candle</th><th class="text-left px-4 py-3">Collection</th><th class="text-left px-4 py-3">Price</th><th class="text-left px-4 py-3">Stock</th><th class="text-left px-4 py-3">Rating</th><th class="text-right px-4 py-3">Actions</th></tr></thead><tbody id="tbody"></tbody></table></div>
  <div id="empty" class="hidden text-center py-14 rounded-2xl bg-white mt-4" style="border:1px solid #EDE0CC">No candles</div>
</main>
</div>
</div>
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(26,14,6,.5)"><div class="rounded-[24px] max-w-lg w-full p-6 bg-white" style="max-height:90vh;overflow:auto"><div class="flex justify-between items-center"><h3 id="title" class="font-serif text-2xl">Add candle</h3><button onclick="closeModal()" class="w-9 h-9 rounded-full" style="border:1px solid #EDE0CC">×</button></div>
<form id="form" class="mt-4 space-y-3" onsubmit="save(event)"><input type="hidden" id="editId">
<div><label class="text-[11px] font-extrabold uppercase tracking-widest opacity-50">Name</label><input id="fName" required class="mt-1 w-full rounded-xl px-3 py-2.5 text-sm outline-none" style="border:1px solid #EDE0CC;background:#FFFBF1"></div>
<div class="grid grid-cols-2 gap-3"><div><label class="text-[11px] font-extrabold uppercase tracking-widest opacity-50">Collection</label><select id="fCol" class="mt-1 w-full rounded-xl px-3 py-2.5 text-sm bg-white" style="border:1px solid #EDE0CC"><option>Woody</option><option>Warm</option><option>Fresh</option><option>Floral</option><option>Citrus</option></select></div><div><label class="text-[11px] font-extrabold uppercase tracking-widest opacity-50">Price ₹</label><input id="fPrice" type="number" required class="mt-1 w-full rounded-xl px-3 py-2.5 text-sm" style="border:1px solid #EDE0CC"></div></div>
<div class="grid grid-cols-2 gap-3"><div><label class="text-[11px] font-extrabold uppercase tracking-widest opacity-50">MRP ₹</label><input id="fMrp" type="number" required class="mt-1 w-full rounded-xl px-3 py-2.5 text-sm" style="border:1px solid #EDE0CC"></div><div><label class="text-[11px] font-extrabold uppercase tracking-widest opacity-50">Burn</label><input id="fBurn" placeholder="45h" class="mt-1 w-full rounded-xl px-3 py-2.5 text-sm" style="border:1px solid #EDE0CC"></div></div>
<div><label class="text-[11px] font-extrabold uppercase tracking-widest opacity-50">Scent notes</label><input id="fScent" placeholder="Fig, cedarwood, amber" class="mt-1 w-full rounded-xl px-3 py-2.5 text-sm" style="border:1px solid #EDE0CC"></div>
<div><label class="text-[11px] font-extrabold uppercase tracking-widest opacity-50">Image URL</label><input id="fImg" placeholder="https://…" class="mt-1 w-full rounded-xl px-3 py-2.5 text-sm" style="border:1px solid #EDE0CC"></div>
<div class="grid grid-cols-2 gap-3"><div><label class="text-[11px] font-extrabold uppercase tracking-widest opacity-50">Badge (optional)</label><input id="fBadge" placeholder="Bestseller / New" class="mt-1 w-full rounded-xl px-3 py-2.5 text-sm" style="border:1px solid #EDE0CC"></div><div><label class="text-[11px] font-extrabold uppercase tracking-widest opacity-50">Size</label><input id="fSize" placeholder="180g" value="180g" class="mt-1 w-full rounded-xl px-3 py-2.5 text-sm" style="border:1px solid #EDE0CC"></div></div>
<div><label class="text-[11px] font-extrabold uppercase tracking-widest opacity-50">Story</label><textarea id="fDesc" rows="2" class="mt-1 w-full rounded-xl px-3 py-2.5 text-sm" style="border:1px solid #EDE0CC"></textarea></div>
<button class="w-full py-3 rounded-full font-bold text-white" style="background:#E4572E">Save candle →</button></form></div></div>
<script src="../app.js"></script>
<script>
function render(){
  let list=[...getCandles()];
  const q=document.getElementById('search').value.toLowerCase().trim(), col=document.getElementById('col').value, sort=document.getElementById('sort').value;
  if(q)list=list.filter(p=>(p.name+' '+p.collection+' '+p.scent).toLowerCase().includes(q));
  if(col!=='All')list=list.filter(p=>p.collection===col);
  if(sort==='price-asc')list.sort((a,b)=>a.price-b.price);
  if(sort==='price-desc')list.sort((a,b)=>b.price-a.price);
  if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name));
  if(sort==='newest')list.reverse();
  document.getElementById('count').textContent=`(${list.length})`;
  const tb=document.getElementById('tbody'), em=document.getElementById('empty');
  if(!list.length){tb.innerHTML='';em.classList.remove('hidden');return;}
  em.classList.add('hidden');
  tb.innerHTML=list.map(p=>`<tr style="border-top:1px solid #EDE0CC"><td class="px-4 py-3"><div class="flex gap-3 items-center"><img src="${p.image}" onerror="this.src='${FALLBACK_IMG}'" class="w-12 h-12 rounded-xl object-cover" style="border:1px solid #EDE0CC"><div><div class="font-bold">${p.name}</div><div class="text-xs opacity-50">#${p.id} · ${String(p.scent).slice(0,30)}</div></div></div></td><td class="px-4 py-3"><span class="text-xs font-bold px-2.5 py-1 rounded-full" style="border:1px solid #EDE0CC">${p.collection}</span></td><td class="px-4 py-3"><div class="font-extrabold">${formatINR(p.price)}</div><div class="text-xs line-through opacity-40">${formatINR(p.mrp)}</div></td><td class="px-4 py-3">${p.id%4===0?'<span class="text-[11px] font-extrabold px-2 py-1 rounded-full" style="background:#FFF1DC;border:1px solid #EDE0CC">Low · 5</span>':'<span class="text-[11px] font-extrabold px-2 py-1 rounded-full" style="background:#ECFDF5;color:#047857">In stock</span>'}</td><td class="px-4 py-3">★ ${p.rating}</td><td class="px-4 py-3 text-right whitespace-nowrap"><button onclick="edit(${p.id})" class="text-xs font-bold px-3 py-1.5 rounded-full" style="border:1px solid #EDE0CC">Edit</button> <button onclick="del(${p.id})" class="text-xs font-bold px-3 py-1.5 rounded-full" style="border:1px solid #FECACA;color:#DC2626">Delete</button></td></tr>`).join('');
}
function openModal(id=null){
  document.getElementById('modal').classList.remove('hidden');
  if(id){const p=getCandles().find(x=>x.id===id);document.getElementById('title').textContent='Edit candle';document.getElementById('editId').value=p.id;document.getElementById('fName').value=p.name;document.getElementById('fCol').value=p.collection;document.getElementById('fPrice').value=p.price;document.getElementById('fMrp').value=p.mrp;document.getElementById('fBurn').value=p.burn;document.getElementById('fScent').value=p.scent;document.getElementById('fImg').value=p.image;document.getElementById('fBadge').value=p.badge||'';document.getElementById('fDesc').value=p.desc||'';document.getElementById('fSize').value=p.size||'180g';}
  else{document.getElementById('title').textContent='Add candle';document.getElementById('form').reset();document.getElementById('editId').value='';}
}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function edit(id){openModal(id);}
function del(id){if(!confirm('Delete this candle?'))return;saveCandles(getCandles().filter(p=>p.id!==id));render();showToast('Deleted');}
function save(e){e.preventDefault();const id=document.getElementById('editId').value;const data={name:document.getElementById('fName').value.trim(),collection:document.getElementById('fCol').value,price:Number(document.getElementById('fPrice').value),mrp:Number(document.getElementById('fMrp').value),burn:document.getElementById('fBurn').value||'45h',scent:document.getElementById('fScent').value||'Signature blend',image:document.getElementById('fImg').value.trim()||FALLBACK_IMG,badge:document.getElementById('fBadge').value.trim()||null,size:document.getElementById('fSize').value||'180g',desc:document.getElementById('fDesc').value.trim()||'Hand-poured soy candle.',rating:4.8,reviews:60+Math.floor(Math.random()*120)};let list=getCandles();if(id){list=list.map(p=>p.id===Number(id)?{...p,...data}:p);showToast('Updated ✓');}else{const nid=Math.max(...list.map(p=>p.id))+1;const fresh=CANDLE_PRODUCTS.find(c=>c.id===nid%12+1);list.push({id:nid,...data,notes:fresh?.notes,mood:fresh?.mood});showToast('Added ✓');}saveCandles(list);closeModal();render();}
render();
</script>
</body>
</html>
