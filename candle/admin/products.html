<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candles — LUME Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{ink:'#1A1A1A',muted:'#6B6560',paper:'#FDF6EE',line:'#EDE6DA',amber:'#E8B86D',terracotta:'#C86B3C'}}}}</script>
</head>
<body class="bg-paper text-ink antialiased">
<div class="flex min-h-screen">
  <aside class="hidden lg:flex w-[260px] bg-ink text-white flex-col sticky top-0 h-screen"><div class="px-6 py-6 border-b border-white/10"><a href="../index.html" class="flex items-center gap-2"><div class="w-8 h-8 bg-amber text-ink flex items-center justify-center rounded-full font-serif"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18"/></svg></div><span class="font-serif text-lg">LUME</span><span class="text-xs bg-white/10 px-2 py-1 rounded-full ml-2">ADMIN</span></a></div><nav class="flex-1 px-3 py-4 space-y-1 text-sm"><a href="index.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5 rounded-xl hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Dashboard</a><a href="products.html" class="flex items-center gap-3 bg-white text-ink px-3 py-2.5 rounded-xl font-semibold"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Candles</a><a href="custom-orders.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5 rounded-xl hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l2.4 7.2H22l-6.2 4.5 2.4 7.3L12 16.5 5.8 21l2.4-7.3L2 9.2h7.6z"/></svg> Custom</a><a href="orders.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5 rounded-xl hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg> Orders</a><div class="pt-4 mt-4 border-t border-white/10"><a href="../index.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5">← View Store</a></div></nav></aside>
  <div class="flex-1 min-w-0">
    <header class="bg-white border-b border-line sticky top-0 z-10"><div class="px-4 lg:px-8 h-[64px] flex items-center justify-between"><h1 class="font-bold text-lg">Candles <span id="count" class="text-muted font-normal text-sm"></span></h1><div class="flex gap-2"><button onclick="resetCandles();render()" class="hidden sm:inline-flex border border-line px-4 py-2 rounded-full text-sm font-semibold">Reset</button><button onclick="openModal()" class="bg-ink text-white px-5 py-2 rounded-full text-sm font-semibold">+ Add Candle</button></div></div></header>
    <main class="px-4 lg:px-8 py-6">
      <div class="bg-white rounded-2xl border border-line p-4 flex flex-col lg:flex-row gap-3">
        <div class="flex-1 flex items-center gap-2 border border-line rounded-full px-4 py-2.5"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg></span><input id="search" type="text" placeholder="Search scent, collection..." class="flex-1 outline-none text-sm" oninput="render()"></div>
        <select id="col" class="border border-line rounded-full px-4 py-2.5 text-sm bg-white" onchange="render()"><option value="All">All collections</option><option>Woody</option><option>Warm</option><option>Fresh</option><option>Floral</option><option>Citrus</option></select>
        <select id="sort" class="border border-line rounded-full px-4 py-2.5 text-sm bg-white" onchange="render()"><option value="newest">Newest</option><option value="price-asc">Price Low</option><option value="price-desc">Price High</option><option value="name">Name</option></select>
      </div>
      <div class="mt-4 bg-white rounded-2xl border border-line overflow-hidden overflow-x-auto"><table class="w-full text-sm min-w-[740px]"><thead class="text-xs uppercase tracking-widest text-muted bg-paper"><tr><th class="text-left px-4 py-3">Candle</th><th class="text-left px-4 py-3">Collection</th><th class="text-left px-4 py-3">Price</th><th class="text-left px-4 py-3">Stock</th><th class="text-left px-4 py-3">Rating</th><th class="text-right px-4 py-3">Actions</th></tr></thead><tbody id="tbody" class="divide-y divide-line"></tbody></table></div>
      <div id="empty" class="hidden text-center py-16 bg-white rounded-2xl border border-line mt-4"><div class="text-muted">No candles</div><button onclick="document.getElementById('search').value='';render()" class="mt-3 border px-4 py-2 rounded-full text-sm">Clear</button></div>
    </main>
  </div>
</div>
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4"><div class="bg-white rounded-[24px] max-w-lg w-full p-6 max-h-[90vh] overflow-auto"><div class="flex justify-between items-center"><h3 id="title" class="font-semibold text-lg">Add Candle</h3><button onclick="closeModal()" class="w-9 h-9 rounded-full border flex items-center justify-center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><form id="form" class="mt-4 space-y-4" onsubmit="save(event)"><input type="hidden" id="editId"><div><label class="text-xs font-bold uppercase tracking-widest">Name</label><input id="fName" required class="mt-1 w-full border border-line rounded-xl px-3 py-2.5 text-sm outline-none focus:border-ink"></div><div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-bold uppercase tracking-widest">Collection</label><select id="fCol" class="mt-1 w-full border border-line rounded-xl px-3 py-2.5 text-sm bg-white"><option>Woody</option><option>Warm</option><option>Fresh</option><option>Floral</option><option>Citrus</option></select></div><div><label class="text-xs font-bold uppercase tracking-widest">Price ₹</label><input id="fPrice" type="number" required class="mt-1 w-full border border-line rounded-xl px-3 py-2.5 text-sm"></div></div><div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-bold uppercase tracking-widest">MRP ₹</label><input id="fMrp" type="number" required class="mt-1 w-full border border-line rounded-xl px-3 py-2.5 text-sm"></div><div><label class="text-xs font-bold uppercase tracking-widest">Burn</label><input id="fBurn" placeholder="45h" class="mt-1 w-full border border-line rounded-xl px-3 py-2.5 text-sm"></div></div><div><label class="text-xs font-bold uppercase tracking-widest">Scent Notes</label><input id="fScent" placeholder="Fig, cedar, amber" class="mt-1 w-full border border-line rounded-xl px-3 py-2.5 text-sm"></div><div><label class="text-xs font-bold uppercase tracking-widest">Image URL</label><input id="fImg" required class="mt-1 w-full border border-line rounded-xl px-3 py-2.5 text-sm"></div><div><label class="text-xs font-bold uppercase tracking-widest">Badge</label><input id="fBadge" placeholder="Bestseller, New..." class="mt-1 w-full border border-line rounded-xl px-3 py-2.5 text-sm"></div><div><label class="text-xs font-bold uppercase tracking-widest">Description</label><textarea id="fDesc" rows="3" class="mt-1 w-full border border-line rounded-xl px-3 py-2.5 text-sm"></textarea></div><div class="flex gap-3 pt-2"><button type="submit" class="flex-1 bg-ink text-white py-3 rounded-full font-semibold">Save</button><button type="button" onclick="closeModal()" class="flex-1 border border-line py-3 rounded-full font-semibold">Cancel</button></div></form></div></div>
<script src="../app.js"></script>
<script>
function render(){
  let list=[...getCandles()];
  const q=document.getElementById('search').value.toLowerCase().trim();
  const col=document.getElementById('col').value;
  const sort=document.getElementById('sort').value;
  if(q) list=list.filter(p=> p.name.toLowerCase().includes(q) || p.collection.toLowerCase().includes(q) || p.scent.toLowerCase().includes(q));
  if(col!=='All') list=list.filter(p=>p.collection===col);
  if(sort==='price-asc') list.sort((a,b)=>a.price-b.price);
  if(sort==='price-desc') list.sort((a,b)=>b.price-a.price);
  if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  if(sort==='newest') list.reverse();
  document.getElementById('count').textContent=`(${list.length})`;
  const tbody=document.getElementById('tbody');
  const empty=document.getElementById('empty');
  if(!list.length){ tbody.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  tbody.innerHTML=list.map(p=>`
    <tr><td class="px-4 py-3"><div class="flex gap-3 items-center"><img src="${p.image}" class="w-12 h-12 rounded-xl object-cover border border-line"><div><div class="font-medium leading-tight">${p.name}</div><div class="text-xs text-muted">#${p.id} • ${p.scent.slice(0,28)}</div></div></div></td><td class="px-4 py-3"><span class="border border-line rounded-full px-2.5 py-1 text-xs">${p.collection}</span></td><td class="px-4 py-3"><div class="font-semibold">${formatINR(p.price)}</div><div class="text-xs line-through text-muted">${formatINR(p.mrp)}</div></td><td class="px-4 py-3">${p.id%4===0?'<span class="text-xs bg-amber/30 border border-amber/30 px-2 py-1 rounded-full">Low: 5</span>':'<span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-1 rounded-full">In stock</span>'}</td><td class="px-4 py-3"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> ${p.rating}</td><td class="px-4 py-3 text-right"><button onclick="edit(${p.id})" class="text-xs border border-line rounded-full px-3 py-1.5 hover:bg-ink hover:text-white">Edit</button><button onclick="del(${p.id})" class="text-xs border border-red-200 text-red-600 rounded-full px-3 py-1.5 hover:bg-red-600 hover:text-white ml-1">Delete</button></td></tr>
  `).join('');
}
function openModal(id=null){
  document.getElementById('modal').classList.remove('hidden');
  if(id){
    const p=getCandles().find(x=>x.id===id);
    document.getElementById('title').textContent='Edit Candle';
    document.getElementById('editId').value=p.id;
    document.getElementById('fName').value=p.name;
    document.getElementById('fCol').value=p.collection;
    document.getElementById('fPrice').value=p.price;
    document.getElementById('fMrp').value=p.mrp;
    document.getElementById('fBurn').value=p.burn;
    document.getElementById('fScent').value=p.scent;
    document.getElementById('fImg').value=p.image;
    document.getElementById('fBadge').value=p.badge||'';
    document.getElementById('fDesc').value=p.desc||'';
  } else {
    document.getElementById('title').textContent='Add Candle';
    document.getElementById('form').reset();
    document.getElementById('editId').value='';
  }
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
function edit(id){ openModal(id); }
function del(id){ if(!confirm('Delete?')) return; let list=getCandles().filter(p=>p.id!==id); saveCandles(list); render(); showToast('Deleted'); }
function save(e){
  e.preventDefault();
  const id=document.getElementById('editId').value;
  const data={ name:document.getElementById('fName').value.trim(), collection:document.getElementById('fCol').value, price:Number(document.getElementById('fPrice').value), mrp:Number(document.getElementById('fMrp').value), burn:document.getElementById('fBurn').value||'45h', scent:document.getElementById('fScent').value||'Custom scent', image:document.getElementById('fImg').value.trim(), badge:document.getElementById('fBadge').value.trim()||null, desc:document.getElementById('fDesc').value.trim()||'Hand-poured soy candle.', rating:4.8, reviews: Math.floor(50+Math.random()*150), size:'180g' };
  let list=getCandles();
  if(id){ const idx=list.findIndex(p=>p.id===Number(id)); list[idx]={...list[idx],...data}; showToast('Updated'); }
  else { const nid=Math.max(...list.map(p=>p.id))+1; list.push({id:nid,...data}); showToast('Added'); }
  saveCandles(list); closeModal(); render();
}
render();
</script>
</body>
</html>
