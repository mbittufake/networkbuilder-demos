<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — LUME Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{serif:['Fraunces','serif'],sans:['Manrope','sans-serif']},colors:{paper:'#FFFBF1',ink:'#1A0E06',ember:'#E4572E',line:'#EDE0CC'}}}}</script>
<style>body{background:#FFFBF1;color:#1A0E06;font-family:Manrope,sans-serif}.navA{background:#FFFBF1!important;color:#1A0E06!important;font-weight:800}</style>
</head>
<body>
<div class="flex min-h-screen">
<aside class="hidden lg:flex w-[260px] flex-col sticky top-0 h-screen text-white" style="background:#1A0E06"><div class="px-6 py-6" style="border-bottom:1px solid rgba(255,255,255,.1)"><a href="../index.html" class="flex items-center gap-2"><span class="w-9 h-9 rounded-full flex items-center justify-center" style="background:#E4572E">✦</span><span class="font-serif text-xl">Lume.</span><span class="text-[10px] font-extrabold px-2 py-1 rounded-full bg-white/10">STUDIO</span></a></div><nav class="flex-1 px-3 py-4 space-y-1 text-sm font-semibold"><a href="index.html" class="flex px-4 py-3 rounded-2xl text-white/70 hover:bg-white/10">◍ Dashboard</a><a href="products.html" class="flex px-4 py-3 rounded-2xl text-white/70 hover:bg-white/10">🕯️ Candles</a><a href="custom-orders.html" class="flex px-4 py-3 rounded-2xl text-white/70 hover:bg-white/10">✦ Custom</a><a href="orders.html" class="navA flex px-4 py-3 rounded-2xl">▤ Orders</a><div class="pt-4 mt-4" style="border-top:1px solid rgba(255,255,255,.1)"><a href="../index.html" class="flex px-4 py-2 text-white/60 text-[13px]">← View store</a></div></nav></aside>
<div class="flex-1 min-w-0">
<header class="sticky top-0 z-10 bg-white/90" style="border-bottom:1px solid #EDE0CC"><div class="px-4 lg:px-8 h-[64px] flex items-center justify-between gap-3"><h1 class="font-serif text-2xl">Orders <span id="count" class="text-sm opacity-50"></span></h1><div class="flex gap-2"><input id="search" placeholder="Search order / customer" class="rounded-full px-4 py-2 text-sm w-44 md:w-56 outline-none" style="border:1px solid #EDE0CC" oninput="render()"><select id="status" class="rounded-full px-4 py-2 text-sm bg-white font-semibold" style="border:1px solid #EDE0CC" onchange="render()"><option value="All">All</option><option>Paid</option><option>Processing</option><option>Shipped</option><option>Delivered</option></select></div></div></header>
<main class="px-4 lg:px-8 py-6 max-w-6xl">
<div class="grid grid-cols-3 gap-3 mb-4"><div class="rounded-2xl bg-white p-4 text-center" style="border:1px solid #EDE0CC"><div class="text-[11px] uppercase tracking-widest opacity-50 font-extrabold">Orders</div><div class="text-xl font-extrabold" id="kTotal">0</div></div><div class="rounded-2xl bg-white p-4 text-center" style="border:1px solid #EDE0CC"><div class="text-[11px] uppercase tracking-widest opacity-50 font-extrabold">Revenue</div><div class="text-xl font-extrabold" id="kRev">₹0</div></div><div class="rounded-2xl p-4 text-center text-white" style="background:#1A0E06"><div class="text-[11px] uppercase tracking-widest opacity-50 font-extrabold">To ship</div><div class="text-xl font-extrabold" id="kPending">0</div></div></div>
<div class="rounded-2xl bg-white overflow-hidden overflow-x-auto" style="border:1px solid #EDE0CC"><table class="w-full text-sm min-w-[760px]"><thead class="text-[11px] uppercase tracking-widest opacity-50" style="background:#FFFBF1"><tr><th class="text-left px-4 py-3">Order</th><th class="text-left px-4 py-3">Customer</th><th class="text-left px-4 py-3">Date</th><th class="text-left px-4 py-3">Items</th><th class="text-left px-4 py-3">Total</th><th class="text-left px-4 py-3">Status</th><th class="text-right px-4 py-3">View</th></tr></thead><tbody id="tbody"></tbody></table></div>
</main>
</div>
</div>
<script src="../app.js"></script>
<script>
function render(){
  const orders=getOrders();
  const q=document.getElementById('search').value.toLowerCase().trim(), st=document.getElementById('status').value;
  let list=[...orders];
  if(q)list=list.filter(o=>(o.id+' '+o.customer).toLowerCase().includes(q));
  if(st!=='All')list=list.filter(o=>o.status===st);
  document.getElementById('count').textContent=`(${list.length})`;
  document.getElementById('kTotal').textContent=list.length;
  document.getElementById('kRev').textContent=formatINR(list.reduce((s,o)=>s+o.total,0));
  document.getElementById('kPending').textContent=list.filter(o=>['Paid','Processing'].includes(o.status)).length;
  document.getElementById('tbody').innerHTML=list.map(o=>`<tr style="border-top:1px solid #EDE0CC"><td class="px-4 py-3 font-extrabold">${o.id}</td><td class="px-4 py-3"><div class="font-bold">${o.customer}</div><div class="text-xs opacity-50">${o.email||''}${o.pay?` · ${o.pay}`:''}</div>${o.note?`<div class="text-[11px] mt-0.5" style="color:#B63A17">🎁 ${String(o.note).slice(0,60)}</div>`:''}</td><td class="px-4 py-3 opacity-50">${o.date}</td><td class="px-4 py-3">${o.items}</td><td class="px-4 py-3 font-extrabold">${formatINR(o.total)}</td><td class="px-4 py-3"><select onchange="updateStatus('${o.id}',this.value)" class="rounded-full px-2.5 py-1.5 text-xs font-bold bg-white" style="border:1px solid #EDE0CC">${['Paid','Processing','Shipped','Delivered'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td class="px-4 py-3 text-right"><button onclick="alert('${o.id} — ${o.customer} — ${formatINR(o.total)}${o.note?` — Note: ${String(o.note).slice(0,80)}`:''}')" class="text-xs font-bold px-3 py-1.5 rounded-full" style="border:1px solid #EDE0CC">View</button></td></tr>`).join('')||'<tr><td colspan="7" class="text-center py-10 opacity-50">No orders</td></tr>';
}
function updateStatus(id,val){const list=getOrders();const it=list.find(o=>o.id===id);if(it){it.status=val;saveOrders(list);showToast(`${id} → ${val}`);render();}}
render();
</script>
</body>
</html>
