<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | ClassDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['DM Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    colors: { brand: { 50: '#fef7ee', 100: '#fdedd6', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' } }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans antialiased">

    <!-- Header -->
    <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 md:px-6">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    </div>
                    <span class="text-lg font-semibold tracking-tight">ClassDesk</span>
                </a>
                <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-stone-600">
                    <a href="index.html" class="hover:text-stone-900 transition">Home</a>
                    <a href="courses.html" class="hover:text-stone-900 transition">Courses</a>
                    <a href="contact.html" class="text-stone-900">Contact</a>
                    <a href="admin/dashboard.html" class="text-xs px-3 py-1.5 bg-stone-100 rounded-full hover:bg-stone-200 transition">Admin Panel</a>
                </nav>
                <a href="contact.html" class="bg-stone-900 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-stone-800 transition">Enroll Now</a>
            </div>
        </div>
    </header>

    <section class="bg-white py-12">
        <div class="max-w-6xl mx-auto px-4 md:px-6">
            <h1 class="text-3xl md:text-4xl font-serif text-stone-900 mb-2">Get in Touch</h1>
            <p class="text-stone-600">We're here to help you succeed</p>
        </div>
    </section>

    <section class="py-12">
        <div class="max-w-6xl mx-auto px-4 md:px-6">
            <div class="grid md:grid-cols-2 gap-8">
                <!-- Contact Options -->
                <div class="space-y-4">
                    <a href="tel:+919876543210" class="block bg-white rounded-2xl p-6 border border-stone-200 hover:border-stone-300 hover:shadow-lg transition duration-300">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-green-500 rounded-xl flex items-center justify-center">
                                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.828 1.153a1 1 0 01-.54 1.384l-2.297.918a11.035 11.035 0 00-5.025 5.025l.918-2.297a1 1 0 011.384-.54l1.153.828A1 1 0 019 14.847V17a1 1 0 01-1 1H3a1 1 0 01-1-1V3z"/></svg>
                            </div>
                            <div>
                                <div class="text-sm text-stone-500">Call us</div>
                                <div class="font-semibold text-lg">+91 98765 43210</div>
                            </div>
                        </div>
                    </a>
                    <a href="https://wa.me/919876543210" target="_blank" class="block bg-white rounded-2xl p-6 border border-stone-200 hover:border-stone-300 hover:shadow-lg transition duration-300">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-green-500 rounded-xl flex items-center justify-center">
                                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.828 1.153a1 1 0 01-.54 1.384l-2.297.918a11.035 11.035 0 00-5.025 5.025l.918-2.297a1 1 0 011.384-.54l1.153.828A1 1 0 019 14.847V17a1 1 0 01-1 1H3a1 1 0 01-1-1V3z"/></svg>
                            </div>
                            <div>
                                <div class="text-sm text-stone-500">WhatsApp</div>
                                <div class="font-semibold text-lg">+91 98765 43210</div>
                            </div>
                        </div>
                    </a>
                    <div class="bg-white rounded-2xl p-6 border border-stone-200">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-brand-50 rounded-xl flex items-center justify-center">
                                <svg class="w-6 h-6 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                            </div>
                            <div>
                                <div class="text-sm text-stone-500">Email</div>
                                <div class="font-semibold text-lg">info@classdesk.in</div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl p-6 border border-stone-200">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-stone-100 rounded-xl flex items-center justify-center">
                                <svg class="w-6 h-6 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            </div>
                            <div>
                                <div class="text-sm text-stone-500">Address</div>
                                <div class="font-semibold">Siliguri, West Bengal</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <div class="bg-white rounded-2xl p-6 md:p-8 border border-stone-200">
                    <h2 class="text-xl font-semibold mb-6">Send us a message</h2>
                    <form class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-stone-700 mb-1">Student Name</label>
                            <input type="text" class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="Enter student name">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-stone-700 mb-1">Parent Phone</label>
                            <input type="tel" class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="+91 98765 43210">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-stone-700 mb-1">Class</label>
                            <select class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                                <option>Select class</option>
                                <option>Class 9</option>
                                <option>Class 10</option>
                                <option>Class 11</option>
                                <option>Class 12</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-stone-700 mb-1">Message</label>
                            <textarea rows="4" class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="Tell us about your requirements..."></textarea>
                        </div>
                        <button type="submit" class="w-full bg-brand-500 text-white py-4 rounded-xl font-medium hover:bg-brand-600 transition">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <section class="py-12 bg-white">
        <div class="max-w-6xl mx-auto px-4 md:px-6">
            <div class="bg-stone-100 rounded-2xl h-64 flex items-center justify-center">
                <span class="text-stone-500">Google Map will appear here</span>
            </div>
        </div>
    </section>

    <footer class="bg-stone-950 text-stone-400 py-8">
        <div class="max-w-6xl mx-auto px-4 md:px-6 text-center text-sm">
            <p>© 2026 ClassDesk. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
