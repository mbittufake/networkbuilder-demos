<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | ClassDesk Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['DM Sans', 'sans-serif'] },
                    colors: { brand: { 50: '#fef7ee', 100: '#fdedd6', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' } }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-100 text-stone-800 font-sans antialiased">

    <div class="lg:hidden fixed top-0 left-0 right-0 bg-white border-b border-stone-200 z-40 px-4 h-14 flex items-center justify-between">
        <a href="../index.html" class="flex items-center gap-2">
            <div class="w-7 h-7 bg-brand-500 rounded-lg flex items-center justify-center">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <span class="font-semibold text-sm">ClassDesk</span>
        </a>
        <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" class="p-2 text-stone-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white border-r border-stone-200 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 top-14 lg:top-0">
        <div class="p-4 border-b border-stone-200"><p class="text-xs text-stone-500">Admin Panel</p></div>
        <nav class="p-3 space-y-1">
            <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-stone-600 rounded-lg hover:bg-stone-50 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg><span class="text-sm font-medium">Dashboard</span></a>
            <a href="students.html" class="flex items-center gap-3 px-3 py-2.5 text-stone-600 rounded-lg hover:bg-stone-50 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg><span class="text-sm font-medium">Students</span></a>
            <a href="add-student.html" class="flex items-center gap-3 px-3 py-2.5 bg-stone-900 text-white rounded-lg text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg><span class="text-sm font-medium">Add Student</span></a>
            <a href="fees.html" class="flex items-center gap-3 px-3 py-2.5 text-stone-600 rounded-lg hover:bg-stone-50 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg><span class="text-sm font-medium">Fee Tracking</span></a>
            <a href="reports.html" class="flex items-center gap-3 px-3 py-2.5 text-stone-600 rounded-lg hover:bg-stone-50 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg><span class="text-sm font-medium">Reports</span></a>
        </nav>
        <div class="absolute bottom-0 w-full p-3 border-t border-stone-200">
            <a href="../index.html" class="flex items-center gap-3 px-3 py-2.5 text-stone-600 rounded-lg hover:bg-stone-50 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg><span class="text-sm font-medium">Back to Website</span></a>
        </div>
    </aside>

    <main class="lg:ml-64 pt-14 lg:pt-0 p-4 md:p-6">
        <div class="mb-6"><h1 class="text-xl md:text-2xl font-semibold text-stone-900">Add New Student</h1><p class="text-stone-500 text-sm">Enroll a new student</p></div>

        <div class="bg-white rounded-xl border border-stone-200 p-4 md:p-6">
            <form class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium text-stone-700 mb-1">Student Name *</label><input type="text" required class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm"></div>
                    <div><label class="block text-sm font-medium text-stone-700 mb-1">Parent Name</label><input type="text" class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm"></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium text-stone-700 mb-1">Phone *</label><input type="tel" required class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm"></div>
                    <div><label class="block text-sm font-medium text-stone-700 mb-1">WhatsApp</label><input type="tel" class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm"></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium text-stone-700 mb-1">Course *</label><select class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm"><option>Choose course</option><option>CBSE Foundation (₹12,000)</option><option>PCM Class 11 (₹18,000)</option><option>PCB Class 12 (₹18,000)</option><option>JEE Crash (₹25,000)</option><option>NEET Crash (₹25,000)</option></select></div>
                    <div><label class="block text-sm font-medium text-stone-700 mb-1">Class</label><select class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm"><option>Select</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></select></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium text-stone-700 mb-1">Total Fee (₹)</label><input type="number" class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm"></div>
                    <div><label class="block text-sm font-medium text-stone-700 mb-1">Initial Payment (₹)</label><input type="number" class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm"></div>
                </div>
                <div><label class="block text-sm font-medium text-stone-700 mb-1">Address</label><textarea rows="2" class="w-full px-4 py-3 border border-stone-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm"></textarea></div>
                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                    <button type="submit" class="bg-brand-500 text-white px-6 py-3 rounded-xl font-medium hover:bg-brand-600 text-sm">Save Student</button>
                    <button type="reset" class="border border-stone-300 px-6 py-3 rounded-xl font-medium hover:bg-stone-50 text-sm">Clear</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
