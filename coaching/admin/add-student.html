<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | ClassDesk Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['DM Sans','sans-serif'],display:['Bricolage Grotesque','sans-serif']},colors:{cream:'#FFFBEB',brand:{500:'#F97316',600:'#EA580C'},cocoa:'#451A03',leaf:'#16A34A'}}}}</script>
    <style>body{font-family:'DM Sans',sans-serif}h1{font-family:'Bricolage Grotesque',sans-serif}.doodle{background-color:#FFFBEB;background-image:radial-gradient(rgba(69,26,3,.08) 1.5px,transparent 1.5px);background-size:20px 20px}</style>
</head>
<body class="bg-cream text-cocoa font-sans antialiased">
    <div class="lg:hidden fixed top-0 left-0 right-0 bg-cream border-b-2 border-cocoa/10 z-40 px-4 h-14 flex items-center justify-between">
        <a href="../index.html" class="flex items-center gap-2"><div class="w-8 h-8 bg-brand-600 rounded-xl flex items-center justify-center border-2 border-cocoa"><span class="text-cream font-extrabold text-sm">C</span></div><span class="font-extrabold text-sm">ClassDesk 📚</span></a>
        <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" class="w-10 h-10 rounded-full bg-white border-2 border-cocoa flex items-center justify-center" style="box-shadow:2px 3px 0 0 #451A03"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    </div>
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-cocoa text-cream z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 top-14 lg:top-0 border-r-2 border-cocoa flex flex-col">
        <div class="p-5 border-b border-cream/10"><div class="flex items-center gap-2"><div class="w-9 h-9 bg-brand-600 rounded-xl flex items-center justify-center border border-cream/20"><span class="font-extrabold">C</span></div><div><div class="font-extrabold">ClassDesk</div><p class="text-[11px] text-cream/50 uppercase tracking-widest">🏫 Staff room</p></div></div></div>
        <nav class="p-3 space-y-1.5 flex-1">
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-cream/70 rounded-2xl hover:bg-white/10 text-sm font-semibold">📊 Dashboard</a>
            <a href="students.html" class="flex items-center gap-3 px-4 py-3 text-cream/70 rounded-2xl hover:bg-white/10 text-sm font-semibold">🎒 Students</a>
            <a href="add-student.html" class="flex items-center gap-3 px-4 py-3 bg-brand-600 text-cream rounded-2xl text-sm font-bold border-2 border-cream/20">➕ Add Student</a>
            <a href="fees.html" class="flex items-center gap-3 px-4 py-3 text-cream/70 rounded-2xl hover:bg-white/10 text-sm font-semibold">💰 Fee Tracking</a>
            <a href="reports.html" class="flex items-center gap-3 px-4 py-3 text-cream/70 rounded-2xl hover:bg-white/10 text-sm font-semibold">📈 Reports</a>
        </nav>
        <div class="p-3 border-t border-cream/10"><a href="../index.html" class="flex items-center gap-3 px-4 py-3 text-cream/70 rounded-2xl hover:bg-white/10 text-sm font-semibold">← Back to Website 🏠</a></div>
    </aside>
    <main class="lg:ml-64 pt-14 lg:pt-0 p-4 md:p-8 doodle min-h-screen">
        <div class="mb-6"><span class="inline-block text-[11px] font-extrabold uppercase tracking-widest bg-white px-3 py-1 rounded-full border-2 border-cocoa mb-2" style="box-shadow:2px 3px 0 0 #451A03">🎒 New admission</span><h1 class="text-3xl font-extrabold tracking-tight">Add New Student ✨</h1><p class="text-cocoa/60 text-sm">Roll no auto-assigned · say hello warmly!</p></div>
        <div class="bg-white rounded-[1.75rem] border-2 border-cocoa p-6 md:p-8" style="box-shadow:5px 6px 0 0 #451A03">
            <form class="space-y-4" onsubmit="event.preventDefault(); this.querySelector('button[type=submit]').textContent='Saved! Welcome aboard 🎉';">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-bold mb-1">Student Name *</label><input required type="text" placeholder="e.g. Aarav Sharma" class="w-full px-4 py-3 bg-cream border-2 border-cocoa/15 rounded-2xl focus:border-brand-600 outline-none text-sm"></div>
                    <div><label class="block text-sm font-bold mb-1">Parent Name</label><input type="text" placeholder="e.g. Mrs. Sharma" class="w-full px-4 py-3 bg-cream border-2 border-cocoa/15 rounded-2xl focus:border-brand-600 outline-none text-sm"></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-bold mb-1">Phone *</label><input required type="tel" placeholder="+91 …" class="w-full px-4 py-3 bg-cream border-2 border-cocoa/15 rounded-2xl focus:border-brand-600 outline-none text-sm"></div>
                    <div><label class="block text-sm font-bold mb-1">WhatsApp</label><input type="tel" placeholder="Same as phone?" class="w-full px-4 py-3 bg-cream border-2 border-cocoa/15 rounded-2xl focus:border-brand-600 outline-none text-sm"></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-bold mb-1">Course *</label><select class="w-full px-4 py-3 bg-cream border-2 border-cocoa/15 rounded-2xl focus:border-brand-600 outline-none text-sm"><option>Choose course 📚</option><option>CBSE Foundation (₹12,000)</option><option>PCM Class 11 (₹18,000)</option><option>PCB Class 12 (₹18,000)</option><option>JEE Crash (₹25,000)</option><option>NEET Crash (₹25,000)</option></select></div>
                    <div><label class="block text-sm font-bold mb-1">Class</label><select class="w-full px-4 py-3 bg-cream border-2 border-cocoa/15 rounded-2xl focus:border-brand-600 outline-none text-sm"><option>Select</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></select></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-bold mb-1">Total Fee (₹)</label><input type="number" placeholder="e.g. 18000" class="w-full px-4 py-3 bg-cream border-2 border-cocoa/15 rounded-2xl focus:border-brand-600 outline-none text-sm"></div>
                    <div><label class="block text-sm font-bold mb-1">Initial Payment (₹)</label><input type="number" placeholder="e.g. 5000" class="w-full px-4 py-3 bg-cream border-2 border-cocoa/15 rounded-2xl focus:border-brand-600 outline-none text-sm"></div>
                </div>
                <div><label class="block text-sm font-bold mb-1">Address</label><textarea rows="2" placeholder="Siliguri address…" class="w-full px-4 py-3 bg-cream border-2 border-cocoa/15 rounded-2xl focus:border-brand-600 outline-none text-sm"></textarea></div>
                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                    <button type="submit" class="bg-brand-600 text-cream px-8 py-3.5 rounded-full font-bold border-2 border-cocoa hover:bg-brand-500 transition text-sm" style="box-shadow:3px 4px 0 0 #451A03">Save Student 🎉</button>
                    <button type="reset" class="bg-white px-8 py-3.5 rounded-full font-bold border-2 border-cocoa text-sm hover:bg-cream transition">Clear</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
