<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — OTAKU Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],display:['Bebas Neue','sans-serif']},colors:{ink:'#0A0A0A',muted:'#9CA3AF',paper:'#F3F3F5',line:'#E5E7EB',accent:'#FF3B82',violet:'#7C3AED',yellow:'#FACC15'}}}}</script>
</head>
<body class="bg-paper text-ink antialiased">
<div class="flex min-h-screen">
  <aside class="hidden lg:flex w-[260px] bg-ink text-white flex-col sticky top-0 h-screen border-r-2 border-ink"><div class="px-6 py-6 border-b border-white/10 flex items-center gap-2"><div class="w-8 h-8 bg-yellow text-ink flex items-center justify-center font-display border-2 border-white">オ</div><span class="font-display text-xl">OTAKU</span><span class="text-xs bg-white text-ink px-2 py-1 rounded-full font-black ml-2">ADMIN</span></div><nav class="flex-1 px-3 py-4 space-y-1 text-sm font-bold"><a href="index.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5 rounded-xl hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> DASHBOARD</a><a href="products.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5 rounded-xl hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> PRODUCTS</a><a href="orders.html" class="flex items-center gap-3 bg-yellow text-ink px-3 py-2.5 rounded-xl border-2 border-white"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg> ORDERS</a><div class="pt-4 mt-4 border-t border-white/10"><a href="../index.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5">← View Store</a></div></nav></aside>
  <div class="flex-1 min-w-0">
    <header class="bg-white border-b-2 border-ink sticky top-0 z-10"><div class="px-4 lg:px-8 h-[64px] flex items-center justify-between"><h1 class="font-display text-2xl tracking-tight">ORDERS <span id="count" class="text-muted font-sans font-bold text-sm"></span></h1><div class="flex gap-2"><input id="search" placeholder="Search order/customer" class="border-2 border-ink rounded-full px-4 py-2 text-sm font-bold w-56" oninput="render()"><select id="status" class="border-2 border-ink rounded-full px-4 py-2 text-sm font-black bg-white" onchange="render()"><option value="All">All</option><option>Paid</option><option>Processing</option><option>Shipped</option><option>Delivered</option></select></div></div></header>
    <main class="px-4 lg:px-8 py-6">
      <div class="grid grid-cols-3 gap-3 mb-4">
        <div class="bg-white rounded-2xl border-2 border-ink p-4 text-center"><div class="text-xs font-black uppercase tracking-widest text-muted">Total</div><div class="text-xl font-black" id="kTotal">0</div></div>
        <div class="bg-white rounded-2xl border-2 border-ink p-4 text-center"><div class="text-xs font-black uppercase tracking-widest text-muted">Revenue</div><div class="text-xl font-black" id="kRev">₹0</div></div>
        <div class="bg-yellow border-2 border-ink rounded-2xl p-4 text-center"><div class="text-xs font-black uppercase tracking-widest">Pending</div><div class="text-xl font-black" id="kPending">0</div></div>
      </div>
      <div class="bg-white rounded-2xl border-2 border-ink overflow-hidden overflow-x-auto"><table class="w-full text-sm min-w-[720px]"><thead class="text-xs font-black uppercase tracking-widest text-muted bg-paper"><tr><th class="text-left px-4 py-3">Order</th><th class="text-left px-4 py-3">Customer</th><th class="text-left px-4 py-3">Date</th><th class="text-left px-4 py-3">Items</th><th class="text-left px-4 py-3">Total</th><th class="text-left px-4 py-3">Status</th><th class="text-right px-4 py-3">Action</th></tr></thead><tbody id="tbody" class="divide-y-2 divide-zinc-100"></tbody></table></div>
    </main>
  </div>
</div>
<script src="../app.js"></script>
<script>
function render(){
  const orders=getOrders(); const q=document.getElementById('search').value.toLowerCase().trim(); const st=document.getElementById('status').value;
  let list=[...orders];
  if(q) list=list.filter(o=> o.id.toLowerCase().includes(q) || o.customer.toLowerCase().includes(q));
  if(st!=='All') list=list.filter(o=>o.status===st);
  document.getElementById('count').textContent=`(${list.length})`;
  document.getElementById('kTotal').textContent=list.length;
  document.getElementById('kRev').textContent=formatINR(list.reduce((s,o)=>s+o.total,0));
  document.getElementById('kPending').textContent=list.filter(o=>['Paid','Processing'].includes(o.status)).length;
  document.getElementById('tbody').innerHTML=list.map(o=>`
    <tr><td class="px-4 py-3 font-black">${o.id}</td><td class="px-4 py-3"><div class="font-black">${o.customer}</div><div class="text-xs font-bold text-muted">${o.email}</div></td><td class="px-4 py-3 font-bold text-muted">${o.date}</td><td class="px-4 py-3 font-black">${o.items}</td><td class="px-4 py-3 font-black">${formatINR(o.total)}</td><td class="px-4 py-3"><select onchange="updateStatus('${o.id}',this.value)" class="border-2 border-ink rounded-full px-2.5 py-1 text-xs font-black bg-white">${['Paid','Processing','Shipped','Delivered'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td class="px-4 py-3 text-right"><button onclick="alert('${o.id} — ${o.customer} — ${formatINR(o.total)}')" class="text-xs border-2 border-ink rounded-full px-3 py-1.5 font-black">VIEW</button></td></tr>
  `).join('');
}
function updateStatus(id,val){ const list=getOrders(); const it=list.find(o=>o.id===id); if(it){ it.status=val; saveOrders(list); showToast(`${id} → ${val}`); render(); } }
render();
</script>
</body>
</html>
