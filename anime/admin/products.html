<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — OTAKU Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],display:['Bebas Neue','sans-serif']},colors:{ink:'#0A0A0A',muted:'#9CA3AF',paper:'#F3F3F5',line:'#E5E7EB',accent:'#FF3B82',violet:'#7C3AED',yellow:'#FACC15'}}}}</script>
</head>
<body class="bg-paper text-ink antialiased">
<div class="flex min-h-screen">
  <aside class="hidden lg:flex w-[260px] bg-ink text-white flex-col sticky top-0 h-screen border-r-2 border-ink"><div class="px-6 py-6 border-b border-white/10 flex items-center gap-2"><div class="w-8 h-8 bg-yellow text-ink flex items-center justify-center font-display border-2 border-white">オ</div><span class="font-display text-xl">OTAKU</span><span class="text-xs bg-white text-ink px-2 py-1 rounded-full font-black ml-2">ADMIN</span></div><nav class="flex-1 px-3 py-4 space-y-1 text-sm font-bold"><a href="index.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5 rounded-xl hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> DASHBOARD</a><a href="products.html" class="flex items-center gap-3 bg-yellow text-ink px-3 py-2.5 rounded-xl border-2 border-white"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> PRODUCTS</a><a href="orders.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5 rounded-xl hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg> ORDERS</a><div class="pt-4 mt-4 border-t border-white/10"><a href="../index.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5">← View Store</a></div></nav></aside>
  <div class="flex-1 min-w-0">
    <header class="bg-white border-b-2 border-ink sticky top-0 z-10"><div class="px-4 lg:px-8 h-[64px] flex items-center justify-between"><h1 class="font-display text-2xl tracking-tight">PRODUCTS <span id="count" class="text-muted font-sans font-bold text-sm"></span></h1><div class="flex gap-2"><button onclick="if(confirm('Reset?')){localStorage.removeItem('otaku_products');location.reload()}" class="hidden sm:inline-flex border-2 border-ink px-4 py-2 rounded-full text-sm font-black">RESET</button><button onclick="openModal()" class="bg-ink text-white border-2 border-ink px-5 py-2 rounded-full text-sm font-black">+ ADD</button></div></div></header>
    <main class="px-4 lg:px-8 py-6">
      <div class="bg-white rounded-2xl border-2 border-ink p-4 flex flex-col lg:flex-row gap-3">
        <div class="flex-1 flex items-center gap-2 border-2 border-ink rounded-full px-4 py-2.5 bg-white"><span class="font-black"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg></span><input id="search" type="text" placeholder="Search Naruto, Luffy, Gojo..." class="flex-1 outline-none text-sm font-bold" oninput="render()"></div>
        <select id="cat" class="border-2 border-ink rounded-full px-4 py-2.5 text-sm font-black bg-white" onchange="render()"><option value="All">All types</option><option>Figures</option><option>Keychains</option><option>Plush</option><option>Posters</option><option>Apparel</option><option>Manga</option></select>
        <select id="sort" class="border-2 border-ink rounded-full px-4 py-2.5 text-sm font-black bg-white" onchange="render()"><option value="newest">Newest</option><option value="price-asc">Price Low</option><option value="price-desc">High</option><option value="name">Name</option></select>
      </div>
      <div class="mt-4 bg-white rounded-2xl border-2 border-ink overflow-hidden overflow-x-auto"><table class="w-full text-sm min-w-[720px]"><thead class="text-xs font-black uppercase tracking-widest text-muted bg-paper"><tr><th class="text-left px-4 py-3">Product</th><th class="text-left px-4 py-3">Type</th><th class="text-left px-4 py-3">Price</th><th class="text-left px-4 py-3">Stock</th><th class="text-left px-4 py-3">Rating</th><th class="text-right px-4 py-3">Action</th></tr></thead><tbody id="tbody" class="divide-y-2 divide-zinc-100"></tbody></table></div>
      <div id="empty" class="hidden text-center py-16 bg-white rounded-2xl border-2 border-ink mt-4"><div class="font-black">NO PRODUCTS</div><button onclick="document.getElementById('search').value='';render()" class="mt-3 border-2 border-ink px-6 py-2 rounded-full font-black">CLEAR</button></div>
    </main>
  </div>
</div>
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4"><div class="bg-white rounded-[24px] border-2 border-ink max-w-lg w-full p-6 max-h-[90vh] overflow-auto"><div class="flex justify-between items-center"><h3 id="title" class="font-display text-2xl">ADD PRODUCT</h3><button onclick="closeModal()" class="w-9 h-9 rounded-full border-2 border-ink flex items-center justify-center font-black"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><form id="form" class="mt-4 space-y-4" onsubmit="save(event)"><input type="hidden" id="editId"><div><label class="text-xs font-black uppercase tracking-widest">Name</label><input id="fName" required class="mt-1 w-full border-2 border-ink rounded-xl px-3 py-2.5 text-sm font-bold outline-none"></div><div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-black uppercase tracking-widest">Category</label><select id="fCat" class="mt-1 w-full border-2 border-ink rounded-xl px-3 py-2.5 text-sm font-bold bg-white"><option>Figures</option><option>Keychains</option><option>Plush</option><option>Posters</option><option>Apparel</option><option>Manga</option></select></div><div><label class="text-xs font-black uppercase tracking-widest">Price ₹</label><input id="fPrice" type="number" required class="mt-1 w-full border-2 border-ink rounded-xl px-3 py-2.5 text-sm font-bold"></div></div><div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-black uppercase tracking-widest">MRP ₹</label><input id="fMrp" type="number" required class="mt-1 w-full border-2 border-ink rounded-xl px-3 py-2.5 text-sm font-bold"></div><div><label class="text-xs font-black uppercase tracking-widest">Stock</label><input id="fStock" type="number" value="12" class="mt-1 w-full border-2 border-ink rounded-xl px-3 py-2.5 text-sm font-bold"></div></div><div><label class="text-xs font-black uppercase tracking-widest">Image URL</label><input id="fImg" required placeholder="https://..." class="mt-1 w-full border-2 border-ink rounded-xl px-3 py-2.5 text-sm"></div><div><label class="text-xs font-black uppercase tracking-widest">Badge</label><input id="fBadge" placeholder="Bestseller, New..." class="mt-1 w-full border-2 border-ink rounded-xl px-3 py-2.5 text-sm"></div><div><label class="text-xs font-black uppercase tracking-widest">Description</label><textarea id="fDesc" rows="3" class="mt-1 w-full border-2 border-ink rounded-xl px-3 py-2.5 text-sm font-bold"></textarea></div><div class="flex gap-3 pt-2"><button type="submit" class="flex-1 bg-ink text-white border-2 border-ink py-3 rounded-full font-black">SAVE</button><button type="button" onclick="closeModal()" class="flex-1 bg-white border-2 border-ink py-3 rounded-full font-black">CANCEL</button></div></form></div></div>
<script src="../app.js"></script>
<script>
function render(){
  let list=[...getProducts()];
  const q=document.getElementById('search').value.toLowerCase().trim();
  const cat=document.getElementById('cat').value;
  const sort=document.getElementById('sort').value;
  if(q) list=list.filter(p=> p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
  if(cat!=='All') list=list.filter(p=>p.category===cat);
  if(sort==='price-asc') list.sort((a,b)=>a.price-b.price);
  if(sort==='price-desc') list.sort((a,b)=>b.price-a.price);
  if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  if(sort==='newest') list.reverse();
  document.getElementById('count').textContent=`(${list.length})`;
  const tbody=document.getElementById('tbody'); const empty=document.getElementById('empty');
  if(!list.length){ tbody.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  tbody.innerHTML=list.map(p=>`
    <tr><td class="px-4 py-3"><div class="flex gap-3 items-center"><img src="${p.image}" class="w-12 h-12 rounded-xl object-cover border-2 border-ink"><div><div class="font-black leading-tight text-sm">${p.name}</div><div class="text-xs font-bold text-muted">#${p.id} • ${p.badge||'—'}</div></div></div></td><td class="px-4 py-3"><span class="bg-yellow border-2 border-ink rounded-full px-2.5 py-1 text-xs font-black">${p.category}</span></td><td class="px-4 py-3"><div class="font-black">${formatINR(p.price)}</div><div class="text-xs line-through font-bold text-muted">${formatINR(p.mrp)}</div></td><td class="px-4 py-3">${p.stock<6?'<span class="bg-red-100 text-red-700 border-2 border-ink px-2 py-1 rounded-full text-xs font-black">Low: '+p.stock+'</span>':'<span class="bg-emerald-100 text-emerald-700 border-2 border-ink px-2 py-1 rounded-full text-xs font-black">'+p.stock+' in stock</span>'}</td><td class="px-4 py-3 font-black"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> ${p.rating}</td><td class="px-4 py-3 text-right"><button onclick="edit(${p.id})" class="text-xs border-2 border-ink rounded-full px-3 py-1.5 font-black hover:bg-ink hover:text-white">EDIT</button><button onclick="del(${p.id})" class="text-xs border-2 border-ink bg-accent text-white rounded-full px-3 py-1.5 font-black ml-1">DEL</button></td></tr>
  `).join('');
}
function openModal(id=null){
  document.getElementById('modal').classList.remove('hidden');
  if(id){
    const p=getProducts().find(x=>x.id===id);
    document.getElementById('title').textContent='EDIT PRODUCT';
    document.getElementById('editId').value=p.id;
    document.getElementById('fName').value=p.name;
    document.getElementById('fCat').value=p.category;
    document.getElementById('fPrice').value=p.price;
    document.getElementById('fMrp').value=p.mrp;
    document.getElementById('fStock').value=p.stock;
    document.getElementById('fImg').value=p.image;
    document.getElementById('fBadge').value=p.badge||'';
    document.getElementById('fDesc').value=p.desc||'';
  } else {
    document.getElementById('title').textContent='ADD PRODUCT';
    document.getElementById('form').reset();
    document.getElementById('editId').value='';
    document.getElementById('fStock').value=12;
  }
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
function edit(id){ openModal(id); }
function del(id){ if(!confirm('Delete?')) return; let list=getProducts().filter(p=>p.id!==id); saveProducts(list); render(); showToast('Deleted'); }
function save(e){
  e.preventDefault();
  const id=document.getElementById('editId').value;
  const data={ name:document.getElementById('fName').value.trim(), category:document.getElementById('fCat').value, price:Number(document.getElementById('fPrice').value), mrp:Number(document.getElementById('fMrp').value), stock:Number(document.getElementById('fStock').value), image:document.getElementById('fImg').value.trim(), badge:document.getElementById('fBadge').value.trim()||null, desc:document.getElementById('fDesc').value.trim()||'Official licensed.', rating:4.8, reviews: Math.floor(80+Math.random()*200) };
  let list=getProducts();
  if(id){ const idx=list.findIndex(p=>p.id===Number(id)); list[idx]={...list[idx],...data}; showToast('Updated'); }
  else { const nid=Math.max(...list.map(p=>p.id))+1; list.push({id:nid,...data}); showToast('Added'); }
  saveProducts(list); closeModal(); render();
}
render();
</script>
</body>
</html>
