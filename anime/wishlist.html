<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — OTAKU</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],display:['Bebas Neue','sans-serif']},colors:{ink:'#0A0A0A',muted:'#9CA3AF',paper:'#F3F3F5',line:'#E5E7EB',accent:'#FF3B82',violet:'#7C3AED',yellow:'#FACC15'}}}}</script>
</head>
<body class="bg-white text-ink antialiased">
<div class="bg-ink text-white text-xs flex items-center justify-center gap-2 py-2.5 tracking-widest uppercase">Free shipping over ₹1,999</div>
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-line">
  <div class="max-w-[1280px] mx-auto px-4 lg:px-6">
    <div class="flex items-center justify-between h-[64px] lg:h-[72px]">
      <button id="mobileMenuBtn" class="lg:hidden w-10 h-10 flex items-center justify-center border border-line rounded-full"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <a href="index.html" class="flex items-center gap-2"><div class="w-9 h-9 bg-ink text-accent flex items-center justify-center font-display text-xl border-2 border-ink">オ</div><span class="font-display text-2xl tracking-tight">OTAKU</span></a>
      <nav class="hidden lg:flex items-center gap-6 text-sm font-semibold">
        <a href="shop.html" class="hover:text-accent">Shop All</a><a href="shop.html?cat=Figures" class="hover:text-accent">Figures</a><a href="wishlist.html" class="font-black border-b-2 border-ink">WISHLIST</a>
      </nav>
      <div class="flex items-center gap-2">
        <button onclick="openSearch()" class="w-10 h-10 rounded-full border border-line hover:border-ink flex items-center justify-center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg></button>
        <button onclick="openCartDrawer()" class="relative w-10 h-10 rounded-full bg-ink text-white flex items-center justify-center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9H7z"/><path d="M6 6L5 2H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg><span data-cart-count class="hidden absolute -top-1 -right-1 bg-yellow text-ink text-[10px] min-w-[18px] h-[18px] px-1 rounded-full flex items-center justify-center font-black">0</span></button>
      </div>
    </div>
  </div>
  <div id="mobileMenu" class="hidden lg:hidden border-t border-line bg-white px-4 py-4 space-y-3"><a href="shop.html" class="block py-2 font-bold">Shop All</a></div>
</header>

<div class="max-w-[1280px] mx-auto px-4 lg:px-6 pt-8">
  <h1 class="font-display text-4xl tracking-tight">WISHLIST <span id="count" class="text-lg text-muted font-sans font-bold"></span></h1>
  <div id="empty" class="hidden text-center py-20 bg-paper border-2 border-ink rounded-[24px] mt-6">
    <div class="w-16 h-16 rounded-full bg-white border-2 border-ink flex items-center justify-center mx-auto text-xl font-black"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-4.5-8.5-8.2A5 5 0 0 1 12 5a5 5 0 0 1 8.5 7.8C18 16.5 12 21 12 21z"/></svg></div>
    <div class="font-display text-3xl mt-4">NO WISHES YET</div>
    <p class="text-sm text-muted">Save your grails.</p>
    <a href="shop.html" class="inline-flex mt-6 bg-ink text-white px-7 py-3 rounded-full font-black tracking-widest">SHOP NOW →</a>
  </div>
  <div id="grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-6 mt-6"></div>
</div>

<footer class="max-w-[1280px] mx-auto px-4 lg:px-6 mt-10 border-t-2 border-ink pt-8 pb-8 text-center text-xs font-bold text-muted">© 2026 OTAKU • Demo by Network Builder</footer>

<div id="searchOverlay" class="hidden fixed inset-0 z-[60] bg-white/95 backdrop-blur"><div class="max-w-2xl mx-auto px-4 pt-8"><div class="flex items-center gap-3"><div class="flex-1 flex items-center gap-3 border-2 border-ink rounded-full px-5 py-3 bg-white"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg><input id="searchInput" type="text" placeholder="Search Naruto, Luffy..." class="flex-1 outline-none text-sm font-medium" oninput="renderSearchResults(this.value)"></div><button onclick="closeSearch()" class="w-11 h-11 rounded-full bg-ink text-white flex items-center justify-center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div id="searchResults" class="mt-6 max-h-[60vh] overflow-auto divide-y divide-zinc-100 border-2 border-ink rounded-2xl bg-white"></div></div></div>
<div id="cartDrawer" class="hidden fixed inset-0 z-[60]"><div class="absolute inset-0 bg-black/50" onclick="closeCartDrawer()"></div><div class="absolute right-0 top-0 h-full w-full max-w-md bg-white flex flex-col border-l-2 border-ink"><div class="px-6 py-5 border-b-2 border-ink flex items-center justify-between bg-yellow"><div class="font-black tracking-widest">YOUR CART <span id="cartDrawerCountLabel" class="font-normal normal-case text-sm"></span></div><button onclick="closeCartDrawer()" class="w-9 h-9 rounded-full bg-ink text-white flex items-center justify-center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div id="cartDrawerItems" class="flex-1 overflow-auto px-6"></div><div id="cartDrawerFooter" class="hidden border-t-2 border-ink p-6 bg-paper"><div class="flex justify-between text-sm"><span class="text-muted">Subtotal</span><span id="cartDrawerSubtotal" class="font-black"></span></div><a href="cart.html" class="mt-4 block bg-ink text-white text-center py-3.5 rounded-full font-black tracking-widest">CHECKOUT →</a></div></div></div>

<script src="app.js"></script>
<script>
function render(){
  const ids=getWishlist(); const list=getProducts().filter(p=>ids.includes(p.id));
  document.getElementById('count').textContent=ids.length?`(${ids.length})`:'';
  const empty=document.getElementById('empty'); const grid=document.getElementById('grid');
  if(!list.length){ empty.classList.remove('hidden'); grid.innerHTML=''; return; }
  empty.classList.add('hidden');
  grid.innerHTML=list.map(p=>`
    <div class="group block">
      <div class="relative aspect-[4/5] rounded-[20px] overflow-hidden bg-white border-2 border-ink">
        <a href="product.html?id=${p.id}"><img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700"></a>
        <button onclick="toggleWishlist(${p.id});render();showToast('Removed')" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-yellow border-2 border-ink flex items-center justify-center font-black"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-4.5-8.5-8.2A5 5 0 0 1 12 5a5 5 0 0 1 8.5 7.8C18 16.5 12 21 12 21z"/></svg></button>
      </div>
      <div class="pt-3"><div class="text-[10px] font-black uppercase tracking-widest text-violet">${p.category}</div><a href="product.html?id=${p.id}" class="font-bold leading-tight hover:underline text-sm">${p.name}</a><div class="font-black mt-1">${formatINR(p.price)}</div><div class="flex gap-2 mt-3"><button onclick="addToCart(getProducts().find(x=>x.id===${p.id}));showToast('Added <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>')" class="flex-1 bg-ink text-white text-xs font-black tracking-widest py-2.5 rounded-full">ADD TO CART</button><button onclick="toggleWishlist(${p.id});render()" class="w-10 h-10 rounded-full border-2 border-ink flex items-center justify-center font-black"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div></div>
    </div>
  `).join('');
}
render();
</script>
</body>
</html>
