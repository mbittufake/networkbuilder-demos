<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — OTAKU</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],display:['Bebas Neue','sans-serif']},colors:{ink:'#0A0A0A',muted:'#9CA3AF',paper:'#F3F3F5',line:'#E5E7EB',accent:'#FF3B82',violet:'#7C3AED',yellow:'#FACC15'}}}}</script>
</head>
<body class="bg-white text-ink antialiased">
<div class="bg-ink text-white text-xs flex items-center justify-center gap-2 py-2.5 tracking-widest uppercase">Free shipping over ₹1,999</div>
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-line">
  <div class="max-w-[1280px] mx-auto px-4 lg:px-6">
    <div class="flex items-center justify-between h-[64px] lg:h-[72px]">
      <button id="mobileMenuBtn" class="lg:hidden w-10 h-10 flex items-center justify-center border border-line rounded-full"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <a href="index.html" class="flex items-center gap-2"><div class="w-9 h-9 bg-ink text-accent flex items-center justify-center font-display text-xl border-2 border-ink">オ</div><span class="font-display text-2xl tracking-tight">OTAKU</span></a>
      <nav class="hidden lg:flex items-center gap-6 text-sm font-semibold">
        <a href="shop.html" class="hover:text-accent">Shop All</a><a href="shop.html?cat=Figures" class="hover:text-accent">Figures</a><a href="search.html" class="font-black border-b-2 border-ink">SEARCH</a>
      </nav>
      <div class="flex items-center gap-2">
        <button onclick="openSearch()" class="w-10 h-10 rounded-full bg-yellow border-2 border-ink flex items-center justify-center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg></button>
        <button onclick="openCartDrawer()" class="relative w-10 h-10 rounded-full bg-ink text-white flex items-center justify-center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9H7z"/><path d="M6 6L5 2H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg><span data-cart-count class="hidden absolute -top-1 -right-1 bg-yellow text-ink text-[10px] min-w-[18px] h-[18px] px-1 rounded-full flex items-center justify-center font-black">0</span></button>
      </div>
    </div>
  </div>
  <div id="mobileMenu" class="hidden lg:hidden border-t border-line bg-white px-4 py-4 space-y-3"><a href="shop.html" class="block py-2 font-bold">Shop All</a></div>
</header>

<div class="max-w-[1280px] mx-auto px-4 lg:px-6 pt-8">
  <h1 class="font-display text-4xl tracking-tight">SEARCH</h1>
  <div class="mt-6 max-w-3xl">
    <div class="flex items-center gap-3 border-2 border-ink rounded-full px-6 py-4 bg-white shadow-[4px_4px_0px_#0A0A0A]">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg>
      <input id="q" type="text" placeholder="Try Naruto, Luffy, Gojo, One Piece..." class="flex-1 outline-none text-base font-bold" autofocus>
      <button onclick="document.getElementById('q').value='';renderSearch()" class="text-muted hover:text-ink font-black">CLEAR</button>
    </div>
    <div class="flex flex-wrap gap-2 mt-4 text-sm font-black">
      <span class="text-muted">Popular:</span>
      <button onclick="setQ('Naruto')" class="border-2 border-ink px-3 py-1 rounded-full hover:bg-ink hover:text-white">NARUTO</button>
      <button onclick="setQ('Luffy')" class="border-2 border-ink px-3 py-1 rounded-full hover:bg-ink hover:text-white">LUFFY</button>
      <button onclick="setQ('Gojo')" class="border-2 border-ink px-3 py-1 rounded-full hover:bg-ink hover:text-white">GOJO</button>
      <button onclick="setQ('Keychain')" class="border-2 border-ink px-3 py-1 rounded-full hover:bg-ink hover:text-white">KEYCHAIN</button>
    </div>
    <div class="flex items-center gap-3 mt-6 text-sm font-bold">
      <select id="cat" class="border-2 border-ink rounded-full px-4 py-2 bg-white"><option value="All">All types</option><option>Figures</option><option>Keychains</option><option>Plush</option><option>Manga</option><option>Posters</option><option>Apparel</option></select>
      <select id="sort" class="border-2 border-ink rounded-full px-4 py-2 bg-white"><option value="featured">Featured</option><option value="price-asc">Price Low</option><option value="price-desc">High</option></select>
      <span id="count" class="text-muted ml-auto font-black"></span>
    </div>
  </div>
  <div id="grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-6 mt-8"></div>
  <div id="no" class="hidden text-center py-20">
    <div class="w-16 h-16 rounded-full bg-yellow border-2 border-ink flex items-center justify-center mx-auto font-black">?</div>
    <div class="font-display text-2xl mt-3">NO RESULTS</div>
  </div>
  <div id="discover" class="mt-12 border-t-2 border-ink pt-8">
    <h3 class="font-black tracking-widest">DISCOVER</h3>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-4">
      <a href="shop.html?cat=Figures" class="rounded-2xl overflow-hidden relative aspect-[4/3] border-2 border-ink"><img src="https://images.unsplash.com/photo-1601850494422-3cf14624b0b3?w=500&h=400&fit=crop&q=80" class="w-full h-full object-cover"><span class="absolute inset-0 bg-black/30"></span><span class="absolute bottom-3 left-3 bg-yellow border-2 border-ink text-ink font-black px-3 py-1 rounded-full text-xs">FIGURES</span></a>
      <a href="shop.html?cat=Keychains" class="rounded-2xl overflow-hidden relative aspect-[4/3] border-2 border-ink"><img src="https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=500&h=400&fit=crop&q=80" class="w-full h-full object-cover"><span class="absolute inset-0 bg-black/30"></span><span class="absolute bottom-3 left-3 bg-white border-2 border-ink text-ink font-black px-3 py-1 rounded-full text-xs">KEYCHAINS</span></a>
      <a href="shop.html?cat=Plush" class="rounded-2xl overflow-hidden relative aspect-[4/3] border-2 border-ink"><img src="https://images.pexels.com/photos/3526022/pexels-photo-3526022.jpeg?auto=compress&cs=tinysrgb&w=500" class="w-full h-full object-cover"><span class="absolute inset-0 bg-black/30"></span><span class="absolute bottom-3 left-3 bg-accent border-2 border-ink text-white font-black px-3 py-1 rounded-full text-xs">PLUSH</span></a>
      <a href="shop.html?cat=Manga" class="rounded-2xl overflow-hidden relative aspect-[4/3] border-2 border-ink"><img src="https://images.unsplash.com/photo-1541963463532-d68292c34b19?w=500&h=400&fit=crop&q=80" class="w-full h-full object-cover"><span class="absolute inset-0 bg-black/30"></span><span class="absolute bottom-3 left-3 bg-violet border-2 border-ink text-white font-black px-3 py-1 rounded-full text-xs">MANGA</span></a>
    </div>
  </div>
</div>

<footer class="max-w-[1280px] mx-auto px-4 lg:px-6 mt-10 border-t-2 border-ink pt-8 pb-8 text-center text-xs font-bold text-muted">© 2026 OTAKU • Demo by Network Builder</footer>

<div id="searchOverlay" class="hidden fixed inset-0 z-[60] bg-white/95 backdrop-blur"><div class="max-w-2xl mx-auto px-4 pt-8"><div class="flex items-center gap-3"><div class="flex-1 flex items-center gap-3 border-2 border-ink rounded-full px-5 py-3 bg-white"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg><input id="searchInput" type="text" placeholder="Search Naruto, Luffy..." class="flex-1 outline-none text-sm font-medium" oninput="renderSearchResults(this.value)"></div><button onclick="closeSearch()" class="w-11 h-11 rounded-full bg-ink text-white flex items-center justify-center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div id="searchResults" class="mt-6 max-h-[60vh] overflow-auto divide-y divide-zinc-100 border-2 border-ink rounded-2xl bg-white"></div></div></div>
<div id="cartDrawer" class="hidden fixed inset-0 z-[60]"><div class="absolute inset-0 bg-black/50" onclick="closeCartDrawer()"></div><div class="absolute right-0 top-0 h-full w-full max-w-md bg-white flex flex-col border-l-2 border-ink"><div class="px-6 py-5 border-b-2 border-ink flex items-center justify-between bg-yellow"><div class="font-black tracking-widest">YOUR CART <span id="cartDrawerCountLabel" class="font-normal normal-case text-sm"></span></div><button onclick="closeCartDrawer()" class="w-9 h-9 rounded-full bg-ink text-white flex items-center justify-center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div id="cartDrawerItems" class="flex-1 overflow-auto px-6"></div><div id="cartDrawerFooter" class="hidden border-t-2 border-ink p-6 bg-paper"><div class="flex justify-between text-sm"><span class="text-muted">Subtotal</span><span id="cartDrawerSubtotal" class="font-black"></span></div><a href="cart.html" class="mt-4 block bg-ink text-white text-center py-3.5 rounded-full font-black tracking-widest">CHECKOUT →</a></div></div></div>

<script src="app.js"></script>
<script>
const q=document.getElementById('q'); const cat=document.getElementById('cat'); const sort=document.getElementById('sort');
const params=new URLSearchParams(location.search); if(params.get('q')) q.value=params.get('q'); if(params.get('cat')) cat.value=params.get('cat');
function setQ(v){ q.value=v; renderSearch(); }
function renderSearch(){
  const query=q.value.toLowerCase().trim(); const c=cat.value; const s=sort.value;
  let list=[...getProducts()];
  if(query) list=list.filter(p=> p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
  if(c!=='All') list=list.filter(p=>p.category===c);
  if(s==='price-asc') list.sort((a,b)=>a.price-b.price);
  if(s==='price-desc') list.sort((a,b)=>b.price-a.price);
  document.getElementById('count').textContent=`${list.length} results${query?` for “${query}”`:''}`;
  const grid=document.getElementById('grid'); const no=document.getElementById('no'); const disc=document.getElementById('discover');
  if(!list.length){ grid.innerHTML=''; no.classList.remove('hidden'); disc.classList.add('hidden'); return; }
  no.classList.add('hidden'); disc.classList.toggle('hidden', !!query || c!=='All');
  grid.innerHTML=list.map(p=>`
    <a href="product.html?id=${p.id}" class="group block">
      <div class="relative aspect-[4/5] rounded-[20px] overflow-hidden bg-white border-2 border-ink"><img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700"><span class="absolute top-2 left-2 bg-yellow border-2 border-ink text-ink text-[10px] font-black px-2 py-1 rounded-full">${p.category}</span><button onclick="event.preventDefault(); toggleWishlist(${p.id}); showToast(isWishlisted(${p.id})?'Wishlist <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>':'Removed'); renderSearch()" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white border-2 border-ink flex items-center justify-center font-black">${isWishlisted(p.id)?'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-4.5-8.5-8.2A5 5 0 0 1 12 5a5 5 0 0 1 8.5 7.8C18 16.5 12 21 12 21z"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-4.5-8.5-8.2A5 5 0 0 1 12 5a5 5 0 0 1 8.5 7.8C18 16.5 12 21 12 21z"/></svg>'}</button></div>
      <div class="pt-3"><div class="text-[10px] font-black uppercase tracking-widest text-violet">${p.category}</div><div class="font-bold leading-tight text-sm">${p.name}</div><div class="font-black mt-1">${formatINR(p.price)}</div></div>
    </a>
  `).join('');
}
q.addEventListener('input', renderSearch); cat.addEventListener('change', renderSearch); sort.addEventListener('change', renderSearch);
renderSearch();
</script>
</body>
</html>
