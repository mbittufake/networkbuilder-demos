<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Crumb & Craft Bakery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans:['Inter','sans-serif'], serif:['Fraunces','serif'], hand:['Caveat','cursive'] },
          colors: { cocoa:'#3E2723', brown:'#8B5A3C', caramel:'#D4A574', cream:'#FAF3E7', parchment:'#FFF8EE', cherry:'#9D2C2C', gold:'#C8964F' },
          boxShadow: { warm:'0 10px 40px -10px rgba(139,90,60,0.35)', soft:'0 6px 24px -6px rgba(62,39,35,0.12)' }
        }
      }
    }
  </script>
  <style>
    .hand-price{font-family:'Caveat',cursive;font-size:1.7rem;font-weight:700;color:#9D2C2C;transform:rotate(-2deg);display:inline-block;line-height:1}
    .wavy-divider{display:block;width:100%;height:22px}
    .paper-bg{background-color:#FFF8EE;background-image:radial-gradient(circle at 1px 1px, rgba(139,90,60,.10) 1.2px, transparent 0);background-size:22px 22px}
    .bake-note{font-family:'Caveat',cursive;font-size:1.35rem;color:#8B5A3C}
    body { font-family:'Inter',sans-serif; }
    h1,h2,h3,h4 { font-family:'Fraunces',serif; }
    .crumb-divider { display:inline-block; width:48px; height:1px; background:#8B5A3C; vertical-align:middle; }
    .pill-pending { background:#FEF3C7; color:#92400E; }
    .pill-baking { background:#DBEAFE; color:#1E40AF; }
    .pill-out { background:#FCE7F3; color:#9D174D; }
    .pill-delivered { background:#D1FAE5; color:#065F46; }
    .pill-cancelled { background:#FEE2E2; color:#991B1B; }
    .qty-btn { transition: background .15s; }
    .qty-btn:hover { background: rgba(212,165,116,0.4); }
    @keyframes fadeUp { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
    .fade-up { animation: fadeUp .4s ease forwards; }
  </style>
</head>
<body class="bg-parchment text-cocoa antialiased min-h-screen">

  <!-- NAV -->
  <nav class="bg-parchment/90 backdrop-blur-md border-b border-cocoa/10 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-full bg-cocoa text-cream flex items-center justify-center font-serif text-xl font-bold">C</div>
        <span class="font-serif text-xl font-bold text-cocoa hidden sm:inline">Crumb &amp; Craft</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="cart.html" class="text-sm font-semibold text-cocoa hover:text-brown flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 8h13"/></svg>
        </a>
        <a href="menu.html" class="text-sm font-semibold bg-cocoa text-cream px-4 py-2 rounded-full hover:bg-brown transition-all">Order Now</a>
      </div>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="bg-cream border-b border-cocoa/10 py-10 lg:py-14">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <div class="flex items-center justify-center gap-3 text-brown text-xs font-black uppercase tracking-widest mb-3">
        <span class="crumb-divider"></span>
        Your Account
        <span class="crumb-divider"></span>
      </div>
      <h1 class="font-serif text-4xl lg:text-5xl font-bold text-cocoa mb-3">My <span class="italic text-brown">orders.</span></h1>
      <p class="font-hand text-3xl text-cherry mt-2 -rotate-1">made slow, served warm!</p>
      <p class="text-cocoa/60 text-sm">View your cart, track orders, and reorder your favourites.</p>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:py-14">

    <!-- TABS -->
    <div class="flex gap-2 mb-8 border-b border-cocoa/10 pb-3">
      <button onclick="showTab('cart')" id="tabCart" class="tab-btn px-5 py-2 rounded-full text-sm font-bold bg-cocoa text-cream transition-all">My Cart</button>
      <button onclick="showTab('orders')" id="tabOrders" class="tab-btn px-5 py-2 rounded-full text-sm font-bold text-cocoa/60 hover:text-cocoa transition-all">Order History</button>
    </div>

    <!-- CART TAB -->
    <div id="cartTab">
      <div id="cartContent" class="fade-up"></div>
    </div>

    <!-- ORDERS TAB -->
    <div id="ordersTab" class="hidden">
      <div id="ordersContent" class="space-y-4 fade-up"></div>
      <div id="noOrders" class="hidden text-center py-16 bg-white rounded-3xl border border-brown/10">
        <div class="text-5xl mb-3">📋</div>
        <h3 class="font-serif text-2xl font-bold text-cocoa mb-2">No orders yet</h3>
        <p class="text-cocoa/60 mb-5 text-sm">When you place an order, it'll show up here.</p>
        <a href="menu.html" class="inline-flex items-center gap-2 bg-cocoa text-cream font-semibold px-5 py-2.5 rounded-full hover:bg-brown transition-all">Browse menu →</a>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-cocoa text-cream pt-14 pb-6 mt-12">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-cream/50">
        <span>© 2026 Crumb &amp; Craft Bakery. Baked with love in Malda.</span>
        <a href="admin/index.html" class="text-cream/30 hover:text-caramel transition-colors">Admin →</a>
      </div>
    </div>
  </footer>

  <script>
    /* ===== Cart + Orders data ===== */
    let cart = JSON.parse(localStorage.getItem('crumb_cart') || '[]');
    const orders = JSON.parse(localStorage.getItem('crumb_orders') || '[]');

    const STATUS_CLASS = { Pending:'pill-pending', Baking:'pill-baking', 'Out for delivery':'pill-out', Delivered:'pill-delivered', Cancelled:'pill-cancelled' };
    const STATUS_FLOW = ['Pending','Baking','Out for delivery','Delivered'];
    const DELIVERY_FEE = { pickup:0, local:150, express:250 };

    function itemEmoji(name) {
      const n = name.toLowerCase();
      if (n.includes('croissant')||n.includes('brioche')||n.includes('babka')||n.includes('pain')||n.includes('danish')||n.includes('kouign')) return '🥐';
      if (n.includes('sourdough')||n.includes('boule')||n.includes('loaf')||n.includes('ciabatta')) return '🍞';
      if (n.includes('focaccia')) return '🥖';
      if (n.includes('cake')||n.includes('tiramisu')||n.includes('cheesecake')) return '🎂';
      if (n.includes('cookie')||n.includes('brownie')||n.includes('biscotti')||n.includes('shortbread')) return '🍪';
      if (n.includes('quiche')||n.includes('galette')||n.includes('pie')) return '🥧';
      if (n.includes('roll')) return '🍥';
      if (n.includes('cupcake')||n.includes('tart')||n.includes('mango')||n.includes('pumpkin')) return '🧁';
      return '🥐';
    }

    /* ===== Tabs ===== */
    function showTab(tab) {
      document.getElementById('cartTab').classList.toggle('hidden', tab !== 'cart');
      document.getElementById('ordersTab').classList.toggle('hidden', tab !== 'orders');
      document.getElementById('tabCart').className = tab === 'cart' ? 'tab-btn px-5 py-2 rounded-full text-sm font-bold bg-cocoa text-cream transition-all' : 'tab-btn px-5 py-2 rounded-full text-sm font-bold text-cocoa/60 hover:text-cocoa transition-all';
      document.getElementById('tabOrders').className = tab === 'orders' ? 'tab-btn px-5 py-2 rounded-full text-sm font-bold bg-cocoa text-cream transition-all' : 'tab-btn px-5 py-2 rounded-full text-sm font-bold text-cocoa/60 hover:text-cocoa transition-all';
    }

    /* ===== Render Cart ===== */
    function renderCart() {
      const wrap = document.getElementById('cartContent');
      if (!cart.length) {
        wrap.innerHTML = `
          <div class="text-center py-16 bg-white rounded-3xl border border-brown/10">
            <div class="text-6xl mb-3">🥐</div>
            <h3 class="font-serif text-2xl font-bold text-cocoa mb-2">Your cart is empty</h3>
            <p class="text-cocoa/60 mb-5 text-sm">Add some fresh bakes to get started.</p>
            <a href="menu.html" class="inline-flex items-center gap-2 bg-cocoa text-cream font-semibold px-5 py-2.5 rounded-full hover:bg-brown transition-all">Browse menu →</a>
          </div>`;
        return;
      }
      const sub = cart.reduce((s,i) => s + i.price * i.qty, 0);
      wrap.innerHTML = `
        <div class="grid lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2">
            <div class="bg-white rounded-3xl border border-brown/10 shadow-soft p-5 sm:p-6">
              <div class="flex items-center justify-between mb-5">
                <h2 class="font-serif text-2xl font-bold text-cocoa flex items-center gap-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 8h13M9 21a1 1 0 11-2 0 1 1 0 012 0zm9 0a1 1 0 11-2 0 1 1 0 012 0z"/></svg> <span class="text-brown font-normal text-lg">(${cart.reduce((s,i)=>s+i.qty,0)})</span></h2>
                <button onclick="clearCart()" class="text-xs font-semibold text-cocoa/60 hover:text-rose-500">Clear all</button>
              </div>
              <div class="divide-y divide-cocoa/10">
                ${cart.map((it, idx) => `
                  <div class="flex gap-4 py-4 first:pt-0 last:pb-0">
                    <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-caramel/40 to-brown/10 flex items-center justify-center text-2xl flex-shrink-0">${itemEmoji(it.name)}</div>
                    <div class="flex-1 min-w-0">
                      <div class="flex items-start justify-between gap-2 mb-1">
                        <div class="font-bold text-cocoa leading-tight">${it.name}</div>
                        <button onclick="removeAt(${idx})" class="text-cocoa/40 hover:text-rose-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 6l12 12M6 18 18 6"/></svg></button>
                      </div>
                      <div class="text-xs text-cocoa/60 mb-2">₹${it.price} each</div>
                      <div class="flex items-center justify-between">
                        <div class="flex items-center bg-cream border border-brown/20 rounded-full overflow-hidden">
                          <button onclick="changeQty(${idx}, -1)" class="qty-btn w-8 h-8 flex items-center justify-center font-bold text-cocoa">−</button>
                          <span class="w-8 text-center font-bold text-sm">${it.qty}</span>
                          <button onclick="changeQty(${idx}, 1)" class="qty-btn w-8 h-8 flex items-center justify-center font-bold text-cocoa">+</button>
                        </div>
                        <div class="font-bold text-brown">₹${(it.price * it.qty).toLocaleString('en-IN')}</div>
                      </div>
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </div>
          <div class="lg:col-span-1">
            <div class="bg-cocoa text-cream rounded-3xl p-6 sticky top-24 shadow-warm">
              <h3 class="font-serif text-xl font-bold mb-4">Summary</h3>
              <div class="space-y-2 text-sm">
                <div class="flex justify-between"><span class="text-cream/60">Subtotal</span><span class="font-bold">₹${sub.toLocaleString('en-IN')}</span></div>
                <div class="flex justify-between"><span class="text-cream/60">Delivery</span><span class="font-bold">Free</span></div>
                <div class="border-t border-cream/15 pt-3 mt-3 flex items-baseline justify-between">
                  <span class="text-cream">Total</span>
                  <span class="font-serif text-2xl font-bold text-caramel">₹${sub.toLocaleString('en-IN')}</span>
                </div>
              </div>
              <a href="cart.html" class="block w-full bg-caramel text-cocoa font-bold py-3 rounded-full mt-5 hover:bg-gold transition-all text-center">Proceed to Checkout</a>
              <a href="menu.html" class="block w-full text-cream/60 hover:text-cream font-semibold py-2 mt-2 text-sm text-center">Continue shopping</a>
            </div>
          </div>
        </div>`;
    }

    function changeQty(i, d) { cart[i].qty = Math.max(1, cart[i].qty + d); persist(); renderCart(); }
    function removeAt(i) { cart.splice(i, 1); persist(); renderCart(); }
    function clearCart() { cart = []; persist(); renderCart(); }
    function persist() { localStorage.setItem('crumb_cart', JSON.stringify(cart)); }

    /* ===== Render Orders ===== */
    function renderOrders() {
      const wrap = document.getElementById('ordersContent');
      const noOrders = document.getElementById('noOrders');
      const userOrders = orders.filter(o => o.status); /* all orders have status */
      if (!userOrders.length) {
        wrap.innerHTML = '';
        noOrders.classList.remove('hidden');
        return;
      }
      noOrders.classList.add('hidden');
      wrap.innerHTML = userOrders.map(o => {
        const methodLabel = { pickup:'Pickup', local:'Local delivery', express:'Express' };
        return `
          <div class="bg-white rounded-3xl border border-brown/10 shadow-soft p-5 sm:p-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
              <div>
                <div class="flex items-center gap-3">
                  <span class="font-bold text-cocoa">${o.id}</span>
                  <span class="${STATUS_CLASS[o.status]} text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-wider">${o.status}</span>
                </div>
                <div class="text-xs text-ash mt-1">${o.time || 'recent'} · ${methodLabel[o.method] || o.method || 'pickup'}</div>
              </div>
              <div class="text-right">
                <div class="font-serif text-xl font-bold text-brown">₹${(o.total || 0).toLocaleString('en-IN')}</div>
              </div>
            </div>
            <div class="bg-cream/50 rounded-xl p-4">
              <div class="text-xs font-bold text-cocoa/60 uppercase tracking-wider mb-2">Items</div>
              <div class="text-sm text-cocoa">${o.items || '—'}</div>
            </div>
            ${o.c ? `<div class="mt-3 text-xs text-ash">Customer: <span class="font-semibold text-cocoa">${o.c}</span>${o.p ? ' · ' + o.p : ''}</div>` : ''}
          </div>`;
      }).join('');
    }

    /* ===== Init ===== */
    renderCart();
    renderOrders();
  </script>
</body>
</html>
