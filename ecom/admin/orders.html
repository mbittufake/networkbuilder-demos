<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — PERNAL Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],display:['Space Grotesk','sans-serif']},colors:{ink:'#111111',muted:'#6B7280',paper:'#F9F7F3',line:'#E7E5E4',accent:'#C8A96D'}}}}</script>
<style>
  /* PERNAL Japandi Minimal — airy store polish */
  ::selection{background:#C8A96D;color:#111}
  .usp-pill{display:inline-flex;align-items:center;gap:.4rem;border:1px solid #E7E5E4;background:#F9F7F3;border-radius:9999px;padding:.45rem .9rem;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#111}
  .japandi-card img{transition:transform .8s cubic-bezier(.16,1,.3,1)}
  .japandi-card:hover img{transform:scale(1.04)}
  .airy-section{padding-top:clamp(3rem,6vw,5.5rem);padding-bottom:clamp(3rem,6vw,5.5rem)}</style>
</head>
<body class="bg-paper text-ink antialiased">
<div class="flex min-h-screen">
  <aside class="hidden lg:flex w-[260px] bg-ink text-white flex-col sticky top-0 h-screen">
    <div class="px-6 py-6 border-b border-white/10"><a href="../index.html" class="flex items-center gap-2"><div class="w-8 h-8 bg-white text-ink flex items-center justify-center font-display font-bold">P</div><span class="font-display font-bold">PERNAL</span><span class="text-xs bg-white/10 px-2 py-1 rounded-full ml-2">ADMIN</span></a></div>
    <nav class="flex-1 px-3 py-4 space-y-1 text-sm">
      <a href="index.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5 rounded-xl hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Dashboard</a>
      <a href="products.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5 rounded-xl hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Products</a>
      <a href="orders.html" class="flex items-center gap-3 bg-white text-ink px-3 py-2.5 rounded-xl font-semibold"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg> Orders</a>
      <a href="customers.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5 rounded-xl hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14a4 4 0 0 1 8 0"/><circle cx="12" cy="10" r="2.5"/></svg> Customers</a>
      <div class="pt-4 mt-4 border-t border-white/10"><a href="../index.html" class="flex items-center gap-3 text-white/70 px-3 py-2.5">← View Store</a></div>
    </nav>
  </aside>
  <div class="flex-1 min-w-0">
    <header class="bg-white border-b border-line sticky top-0 z-10">
      <div class="px-4 lg:px-8 h-[64px] flex items-center justify-between">
        <h1 class="font-display font-bold text-lg">Orders <span id="count" class="text-muted font-normal text-sm"></span></h1>
        <div class="flex gap-2">
          <input id="search" placeholder="Search order or customer" class="border border-line rounded-full px-4 py-2 text-sm w-48 lg:w-64" oninput="renderOrders()">
          <select id="status" class="border border-line rounded-full px-4 py-2 text-sm bg-white" onchange="renderOrders()">
            <option value="All">All status</option><option>Paid</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option>
          </select>
        </div>
      </div>
    </header>
    <main class="px-4 lg:px-8 py-6">
      <div class="grid grid-cols-3 gap-3 mb-4">
        <div class="bg-white rounded-2xl border border-line p-4 text-center"><div class="text-xs uppercase tracking-widest text-muted">Total Orders</div><div class="text-xl font-bold" id="kTotal">0</div></div>
        <div class="bg-white rounded-2xl border border-line p-4 text-center"><div class="text-xs uppercase tracking-widest text-muted">Revenue</div><div class="text-xl font-bold" id="kRev">₹0</div></div>
        <div class="bg-white rounded-2xl border border-line p-4 text-center"><div class="text-xs uppercase tracking-widest text-muted">Pending</div><div class="text-xl font-bold" id="kPending">0</div></div>
      </div>
      <div class="bg-white rounded-2xl border border-line overflow-hidden overflow-x-auto">
        <table class="w-full text-sm min-w-[720px]">
          <thead class="text-xs uppercase tracking-widest text-muted bg-paper"><tr><th class="text-left px-4 py-3">Order</th><th class="text-left px-4 py-3">Customer</th><th class="text-left px-4 py-3">Date</th><th class="text-left px-4 py-3">Items</th><th class="text-left px-4 py-3">Total</th><th class="text-left px-4 py-3">Status</th><th class="text-right px-4 py-3">Action</th></tr></thead>
          <tbody id="tbody" class="divide-y divide-line"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>
<script src="../app.js"></script>
<script>
function renderOrders(){
  const orders=getOrders();
  const q=document.getElementById('search').value.toLowerCase().trim();
  const st=document.getElementById('status').value;
  let list=[...orders];
  if(q) list=list.filter(o=> o.id.toLowerCase().includes(q) || o.customer.toLowerCase().includes(q) || o.email.toLowerCase().includes(q));
  if(st!=='All') list=list.filter(o=>o.status===st);
  document.getElementById('count').textContent=`(${list.length})`;
  document.getElementById('kTotal').textContent=list.length;
  document.getElementById('kRev').textContent=formatINR(list.reduce((s,o)=>s+o.total,0));
  document.getElementById('kPending').textContent=list.filter(o=>['Paid','Processing'].includes(o.status)).length;
  document.getElementById('tbody').innerHTML=list.map(o=>`
    <tr>
      <td class="px-4 py-3 font-medium">${o.id}</td>
      <td class="px-4 py-3"><div class="font-medium">${o.customer}</div><div class="text-xs text-muted">${o.email}</div></td>
      <td class="px-4 py-3 text-muted">${o.date}</td>
      <td class="px-4 py-3">${o.items}</td>
      <td class="px-4 py-3 font-semibold">${formatINR(o.total)}</td>
      <td class="px-4 py-3">
        <select onchange="updateStatus('${o.id}', this.value)" class="border border-line rounded-full px-2.5 py-1 text-xs bg-white">
          ${['Paid','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td class="px-4 py-3 text-right"><button onclick="viewOrder('${o.id}')" class="text-xs border border-line rounded-full px-3 py-1.5 hover:bg-ink hover:text-white">View</button></td>
    </tr>
  `).join('');
}
function updateStatus(id, status){
  const list=getOrders();
  const it=list.find(o=>o.id===id);
  if(it){ it.status=status; saveOrders(list); showToast(`Order ${id} → ${status}`); renderOrders(); }
}
function viewOrder(id){
  const o=getOrders().find(x=>x.id===id);
  alert(`Order ${o.id}\nCustomer: ${o.customer} (${o.email})\nDate: ${o.date}\nItems: ${o.items}\nTotal: ${formatINR(o.total)}\nStatus: ${o.status}\n\n(Demo detail view)`);
}
renderOrders();
</script>
</body>
</html>
